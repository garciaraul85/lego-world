<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Racing & sports</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141519}
a{color:#ffcc00}a:hover{color:#ffd633}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:none;background:#24262d;color:#f2f2f4;font:600 14px 'Figtree',sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:#2c2f37;color:#fff}
.pri{background:#ffcc00;color:#141519}
.pri:hover{background:#ffd633;color:#141519}
.ico{width:40px;padding:0}
.card{background:#1d1f25;border-radius:20px;padding:18px}
.ltab{padding:8px 14px;border-radius:10px;border:none;background:none;color:#9ea3ad;font:600 14px 'Figtree',sans-serif;cursor:pointer}
.ltab:hover{color:#f2f2f4}
.lon{background:#24262d;color:#f2f2f4}
.tilelib{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;padding:10px 6px;border-radius:14px;background:#24262d;color:#f2f2f4;font:600 12px 'Figtree',sans-serif;cursor:grab;user-select:none;text-align:center}
.tilelib:hover{background:#2c2f37}
.menu{position:absolute;z-index:30;min-width:220px;padding:6px;border-radius:14px;background:#24262d;box-shadow:0 16px 40px #000a;display:flex;flex-direction:column}
.mi{display:flex;justify-content:space-between;gap:16px;padding:9px 12px;border:none;border-radius:9px;background:none;color:#f2f2f4;font:500 14px 'Figtree',sans-serif;text-align:left;cursor:pointer}
.mi:hover{background:#ffcc0026}
.sep{height:1px;background:#33363e;margin:4px 8px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#9ea3ad}
.inp{min-height:40px;padding:0 12px;border-radius:10px;border:none;background:#141519;color:#f2f2f4;font:15px 'Figtree',sans-serif}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#2c2f37;font-size:13px;color:#f2f2f4;border:none;font-family:'Figtree',sans-serif;cursor:grab}
.lbl{font-size:13px;font-weight:700;color:#9ea3ad;letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#1d1f25}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:14px;background:#24262d;box-shadow:0 10px 30px #0008;font-size:14px;z-index:40}
</style>
</helmet>
<div style="display: flex; min-height: 900px; background: #141519; color: #f2f2f4; font-family: 'Figtree', system-ui, sans-serif" onClick="{{closeMenu}}">
  <dc-import name="Nav" active="game" hint-size="96px,900px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px">
      <div style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">Racing and sports</span><span style="font-size: 13px; color: #9ea3ad">Lay track pieces by clicking, or set up a sport's rules</span></div>
      <div class="seg"><sc-for list="{{tabs}}" as="t" hint-placeholder-count="2"><button type="button" class="{{t.cls}}" onClick="{{t.pick}}">{{t.name}}</button></sc-for></div>
      <span style="flex: 1 1 auto"></span>
      <button type="button" class="btn ico" aria-label="Undo" onClick="{{undo}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
      <a class="btn" href="Brix.dc.html">Ask Brix</a>
      <a class="btn pri" href="Play.dc.html">Play</a>
    </header>
    <dc-import name="Sub" group="game" active="Racing & sports" hint-size="900px,46px"></dc-import>
    <div data-stage="1" style="position: relative; display: flex; flex-wrap: wrap; gap: 14px; padding: 0 20px 20px; flex: 1 1 auto">
      <sc-if value="{{isRace}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-wrap: wrap; gap: 14px; flex: 1 1 100%">
          <aside class="card" style="flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px">
            <span class="lbl">Pieces · pick, then click the grid</span>
            <sc-for list="{{pieces}}" as="p" hint-placeholder-count="7"><button type="button" style="{{p.style}}" onClick="{{p.pick}}"><span style="{{p.sw}}"></span>{{p.name}}</button></sc-for>
          </aside>
          <section style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
            <div style="display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; padding: 10px; border-radius: 20px; background: #3f8f4a; user-select: none" onMouseLeave="{{up}}" onMouseUp="{{up}}">
              <sc-for list="{{cells}}" as="c" hint-placeholder-count="96"><div style="{{c.style}}" onMouseDown="{{c.down}}" onMouseEnter="{{c.over}}" onContextMenu="{{c.menu}}"><span style="{{c.mark}}">{{c.icon}}</span></div></sc-for>
            </div>
            <span style="{{checkStyle}}">{{checkText}}</span>
          </section>
          <aside class="card" style="flex: 1 1 240px; max-width: 280px; display: flex; flex-direction: column; gap: 14px">
            <label class="fld">Laps · {{laps}}<input type="range" min="1" max="9" value="{{laps}}" onInput="{{setLaps}}" style="accent-color: #ffcc00"></label>
            <label class="fld">Other racers · {{bots}}<input type="range" min="0" max="7" value="{{bots}}" onInput="{{setBots}}" style="accent-color: #ffcc00"></label>
            <div class="fld">How hard<div style="display: flex; gap: 6px"><sc-for list="{{diffs}}" as="d" hint-placeholder-count="3"><button type="button" style="{{d.style}}" onClick="{{d.pick}}">{{d.name}}</button></sc-for></div></div>
            <label style="display: flex; align-items: center; gap: 10px; font-size: 14px"><input type="checkbox" checked style="accent-color: #ffcc00; width: 18px; height: 18px">Catch-up help for the last racer</label>
            <a class="btn pri" href="Play.dc.html">Test the race</a>
          </aside>
        </div>
      </sc-if>
      <sc-if value="{{isSport}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-wrap: wrap; gap: 14px; flex: 1 1 100%">
          <aside class="card" style="flex: 0 0 200px; display: flex; flex-direction: column; gap: 8px">
            <span class="lbl">Sport</span>
            <sc-for list="{{sports}}" as="p" hint-placeholder-count="6"><button type="button" style="{{p.style}}" onClick="{{p.pick}}">{{p.name}}</button></sc-for>
          </aside>
          <section style="flex: 999 1 480px; min-width: 0">
            <div style="{{field}}">
              <sc-for list="{{lines}}" as="l" hint-placeholder-count="3"><span style="{{l}}"></span></sc-for>
              <sc-for list="{{players}}" as="p" hint-placeholder-count="10"><span style="{{p}}"></span></sc-for>
              <span style="{{ball}}"></span>
              <span style="position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: #141519cc; font-weight: 800">{{scoreboard}}</span>
            </div>
          </section>
          <aside class="card" style="flex: 1 1 240px; max-width: 280px; display: flex; flex-direction: column; gap: 14px">
            <label class="fld">Players per team · {{team}}<input type="range" min="1" max="6" value="{{team}}" onInput="{{setTeam}}" style="accent-color: #ffcc00"></label>
            <label class="fld">Match length · {{mins}} min<input type="range" min="1" max="10" value="{{mins}}" onInput="{{setMins}}" style="accent-color: #ffcc00"></label>
            <label class="fld">First to · {{goals}}<input type="range" min="1" max="10" value="{{goals}}" onInput="{{setGoals}}" style="accent-color: #ffcc00"></label>
            <div class="fld">Team colours<div style="display: flex; gap: 10px; align-items: center"><sc-for list="{{teamCols}}" as="c" hint-placeholder-count="2"><button type="button" aria-label="Change colour" style="{{c.style}}" onClick="{{c.next}}"></button></sc-for></div></div>
            <a href="Brain.dc.html" style="font-size: 14px">How teammates play: Teammate brain</a>
          </aside>
        </div>
      </sc-if>
      <sc-if value="{{menu.show}}" hint-placeholder-val="{{ false }}"><div class="menu" style="{{menu.style}}"><span style="padding: 6px 12px 8px; font-size: 12px; font-weight: 700; color: #9ea3ad">{{menu.title}}</span><sc-for list="{{menu.items}}" as="i" hint-placeholder-count="4"><button type="button" class="mi" onClick="{{i.run}}"><span>{{i.label}}</span><span style="color: #9ea3ad; font-size: 12px">{{i.key}}</span></button></sc-for></div></sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const H = {
  at: (e) => { const r = e.currentTarget.closest('[data-stage]').getBoundingClientRect(); return [Math.min(e.clientX - r.left, r.width - 250), Math.min(e.clientY - r.top, r.height - 260)]; },
  menu: (m, title, items) => (m ? { show: true, title, style: 'left: ' + m.x + 'px; top: ' + m.y + 'px', items } : { show: false, title: '', items: [] }),
  toast: (t) => (t ? { show: true, text: t } : { show: false, text: '' }),
  pick: (on) => 'min-height: 38px; padding: 0 14px; border-radius: 10px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: ' + (on ? '#141519' : '#f2f2f4') + '; background: ' + (on ? '#ffcc00' : '#24262d'),
  card: (on) => 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: #f2f2f4; background: ' + (on ? '#3a3420' : '#24262d') + '; box-shadow: ' + (on ? 'inset 0 0 0 2px #ffcc00' : 'none'),
  track: (on) => 'flex: 0 0 auto; width: 46px; height: 28px; border-radius: 14px; position: relative; background: ' + (on ? '#ffcc00' : '#33363e'),
  knob: (on) => 'position: absolute; top: 3px; left: ' + (on ? 21 : 3) + 'px; width: 22px; height: 22px; border-radius: 50%; background: #fff',
  tab: (on) => (on ? 'ltab lon' : 'ltab'),
  sw: (c, on, size) => 'width: ' + (size || 30) + 'px; height: ' + (size || 30) + 'px; border-radius: 8px; border: none; cursor: pointer; background: ' + c + '; box-shadow: ' + (on ? '0 0 0 3px #141519, 0 0 0 5px #fff' : 'none')
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const g = {};
    const ring = [[2, 1, 'Curve', 0], [3, 1, 'Straight', 0], [4, 1, 'Start', 0], [5, 1, 'Straight', 0], [6, 1, 'Boost', 0], [7, 1, 'Straight', 0], [8, 1, 'Curve', 90], [8, 2, 'Straight', 90], [8, 3, 'Ramp', 90], [8, 4, 'Straight', 90], [8, 5, 'Curve', 180], [7, 5, 'Straight', 0], [6, 5, 'Checkpoint', 0], [5, 5, 'Straight', 0], [4, 5, 'Straight', 0], [3, 5, 'Straight', 0], [2, 5, 'Curve', 270], [2, 4, 'Straight', 90], [2, 3, 'Straight', 90], [2, 2, 'Straight', 90]];
    ring.forEach(([x, y, k, r]) => { g[x + ',' + y] = { k, r }; });
    this.state = { tab: 'Racing', piece: 'Straight', grid: g, painting: false, menu: null, laps: 3, bots: 5, diff: 'Normal', sport: 'Soccer', team: 5, mins: 4, goals: 3, cols: ['#e8463c', '#3b78c9'] };
  }
  renderVals() {
    const s = this.state;
    const P = { Straight: ['#4b5058', '═'], Curve: ['#4b5058', '╗'], Start: ['#f2f2f4', '▦'], Boost: ['#ffcc00', '»'], Ramp: ['#ff8a3d', '◢'], Checkpoint: ['#45c46e', '⚑'], Wall: ['#8b93a3', '▮'] };
    const put = (x, y, g) => { const n = Object.assign({}, g); if (s.piece === 'Erase') delete n[x + ',' + y]; else n[x + ',' + y] = { k: s.piece, r: (g[x + ',' + y] || {}).r || 0 }; return n; };
    const cells = [];
    for (let y = 0; y < 8; y++) for (let x = 0; x < 12; x++) { const c = s.grid[x + ',' + y]; cells.push({
      icon: c ? P[c.k][1] : '', mark: 'display: inline-block; transform: rotate(' + (c ? c.r : 0) + 'deg); font-size: 22px; font-weight: 800; color: ' + (c && c.k === 'Start' ? '#141519' : '#fff'),
      style: 'aspect-ratio: 1; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: crosshair; background: ' + (c ? P[c.k][0] : '#4aa356'),
      down: (e) => { if (e.button !== 0) return; e.preventDefault(); this.setState({ grid: put(x, y, s.grid), painting: true, menu: null }); },
      over: () => { if (s.painting) this.setState({ grid: put(x, y, s.grid) }); },
      menu: (e) => { e.preventDefault(); e.stopPropagation(); if (!c) return; const [mx, my] = H.at(e); this.setState({ menu: { x: mx, y: my, k: x + ',' + y } }); } }); }
    const vals = Object.values(s.grid);
    const starts = vals.filter((v) => v.k === 'Start').length, cps = vals.filter((v) => v.k === 'Checkpoint').length;
    const ok = starts === 1 && cps >= 1;
    const m = s.menu; const mc = m ? s.grid[m.k] : null;
    const field = { Soccer: ['#3f8f4a', 'Goals'], Basketball: ['#c9893f', 'Points'], 'Mini golf': ['#45c46e', 'Strokes'], Bowling: ['#d8cfc0', 'Pins'], Tennis: ['#3b78c9', 'Games'], Hockey: ['#dfe9f2', 'Goals'] };
    const pal = ['#e8463c', '#3b78c9', '#ffcc00', '#45c46e', '#a78bfa', '#f2f2f4'];
    return {
      tabs: ['Racing', 'Sports'].map((t) => ({ name: t, cls: H.tab(t === s.tab), pick: () => this.setState({ tab: t }) })),
      isRace: s.tab === 'Racing', isSport: s.tab === 'Sports',
      pieces: Object.keys(P).concat(['Erase']).map((k) => ({ name: k, style: H.pick(k === s.piece) + '; display: flex; align-items: center; gap: 10px', sw: 'width: 20px; height: 20px; border-radius: 5px; background: ' + (P[k] ? P[k][0] : '#4aa356'), pick: () => this.setState({ piece: k }) })),
      cells, up: () => { if (s.painting) this.setState({ painting: false }); },
      checkText: ok ? 'Track looks good: one start line and ' + cps + ' checkpoint' + (cps > 1 ? 's' : '') + '.' : starts !== 1 ? 'A track needs exactly one Start piece.' : 'Add at least one Checkpoint so laps count.',
      checkStyle: 'font-size: 13px; color: ' + (ok ? '#45c46e' : '#ffcc00'),
      laps: s.laps, setLaps: (e) => this.setState({ laps: +e.target.value }),
      bots: s.bots, setBots: (e) => this.setState({ bots: +e.target.value }),
      diffs: ['Easy', 'Normal', 'Hard'].map((d) => ({ name: d, style: H.pick(d === s.diff) + '; flex: 1 1 0; text-align: center; padding: 0 6px', pick: () => this.setState({ diff: d }) })),
      closeMenu: () => { if (s.menu) this.setState({ menu: null }); },
      menu: H.menu(m, mc ? mc.k : '', mc ? [
        { label: 'Turn it', key: 'R', run: () => this.setState({ menu: null, grid: Object.assign({}, s.grid, { [m.k]: { k: mc.k, r: (mc.r + 90) % 360 } }) }) },
        { label: 'Make it a boost', key: '', run: () => this.setState({ menu: null, grid: Object.assign({}, s.grid, { [m.k]: { k: 'Boost', r: mc.r } }) }) },
        { label: 'Remove', key: 'Del', run: () => { const g = Object.assign({}, s.grid); delete g[m.k]; this.setState({ menu: null, grid: g }); } }
      ] : []),
      sports: Object.keys(field).map((k) => ({ name: k, style: H.pick(k === s.sport), pick: () => this.setState({ sport: k }) })),
      field: 'position: relative; height: 560px; border-radius: 20px; overflow: hidden; background: ' + field[s.sport][0],
      lines: ['position: absolute; left: 50%; top: 0; bottom: 0; width: 4px; background: #ffffff88', 'position: absolute; left: calc(50% - 60px); top: calc(50% - 60px); width: 120px; height: 120px; border-radius: 50%; border: 4px solid #ffffff88; box-sizing: border-box', 'position: absolute; left: 0; top: calc(50% - 70px); width: 50px; height: 140px; border: 4px solid #ffffff88; border-left: none; box-sizing: border-box'],
      players: [0, 1].reduce((acc, side) => acc.concat(Array.from({ length: s.team }, (_, i) => 'position: absolute; width: 28px; height: 28px; border-radius: 14px 14px 6px 6px; border: 2px solid #141519; background: ' + s.cols[side] + '; left: ' + (side ? 62 + (i % 3) * 10 : 30 - (i % 3) * 10) + '%; top: ' + (12 + i * (76 / Math.max(1, s.team))) + '%')), []),
      ball: 'position: absolute; left: calc(50% - 10px); top: calc(50% - 10px); width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px #0006',
      scoreboard: '0 – 0 · ' + s.mins + ':00 · first to ' + s.goals + ' ' + field[s.sport][1].toLowerCase(),
      team: s.team, setTeam: (e) => this.setState({ team: +e.target.value }),
      mins: s.mins, setMins: (e) => this.setState({ mins: +e.target.value }),
      goals: s.goals, setGoals: (e) => this.setState({ goals: +e.target.value }),
      teamCols: s.cols.map((c, i) => ({ style: H.sw(c, false, 40), next: () => this.setState({ cols: s.cols.map((x, j) => (j === i ? pal[(pal.indexOf(x) + 1) % pal.length] : x)) }) })),
      undo: () => {}
    };
  }
}
</script>
</body>
</html>
