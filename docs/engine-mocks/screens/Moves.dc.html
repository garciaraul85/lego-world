<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moves & water</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141519}
a{color:#ffcc00}a:hover{color:#ffd633}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:none;background:#24262d;color:#f2f2f4;font:600 14px 'Figtree',sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:#2c2f37;color:#fff}
.pri{background:#ffcc00;color:#141519}
.pri:hover{background:#ffd633;color:#141519}
.ico{width:40px;padding:0}
.card{background:#1d1f25;border-radius:20px;padding:18px}
.ltab{padding:8px 14px;border-radius:10px;border:none;background:none;color:#9ea3ad;font:600 14px 'Figtree',sans-serif;cursor:pointer}
.ltab:hover{color:#f2f2f4}
.lon{background:#24262d;color:#f2f2f4}
.tilelib{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;padding:10px 6px;border-radius:14px;background:#24262d;color:#f2f2f4;font:600 12px 'Figtree',sans-serif;cursor:grab;user-select:none;text-align:center}
.tilelib:hover{background:#2c2f37}
.menu{position:absolute;z-index:30;min-width:220px;padding:6px;border-radius:14px;background:#24262d;box-shadow:0 16px 40px #000a;display:flex;flex-direction:column}
.mi{display:flex;justify-content:space-between;gap:16px;padding:9px 12px;border:none;border-radius:9px;background:none;color:#f2f2f4;font:500 14px 'Figtree',sans-serif;text-align:left;cursor:pointer}
.mi:hover{background:#ffcc0026}
.sep{height:1px;background:#33363e;margin:4px 8px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#9ea3ad}
.inp{min-height:40px;padding:0 12px;border-radius:10px;border:none;background:#141519;color:#f2f2f4;font:15px 'Figtree',sans-serif}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#2c2f37;font-size:13px;color:#f2f2f4;border:none;font-family:'Figtree',sans-serif;cursor:grab}
.lbl{font-size:13px;font-weight:700;color:#9ea3ad;letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#1d1f25}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:14px;background:#24262d;box-shadow:0 10px 30px #0008;font-size:14px;z-index:40}
</style>
</helmet>
<div style="display: flex; min-height: 900px; background: #141519; color: #f2f2f4; font-family: 'Figtree', system-ui, sans-serif">
  <dc-import name="Nav" active="game" hint-size="96px,900px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px">
      <div style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">What the player can do</span><span style="font-size: 13px; color: #9ea3ad">Turn moves on, click one to watch it, pick its button</span></div>
      
      <span style="flex: 1 1 auto"></span>
      <button type="button" class="btn ico" aria-label="Undo" onClick="{{undo}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
      <a class="btn" href="Brix.dc.html">Ask Brix</a>
      <a class="btn pri" href="Play.dc.html">Play</a>
    </header>
    <dc-import name="Sub" group="game" active="Moves & water" hint-size="900px,46px"></dc-import>
    <div data-stage="1" style="position: relative; display: flex; flex-wrap: wrap; gap: 14px; padding: 0 20px 20px; flex: 1 1 auto">
      <aside class="card" style="flex: 0 0 260px; display: flex; flex-direction: column; gap: 6px; max-height: 780px; overflow: auto">
        <sc-for list="{{moves}}" as="m" hint-placeholder-count="12">
          <div style="{{m.row}}" onClick="{{m.pick}}">
            <span style="flex: 1 1 auto; display: flex; flex-direction: column"><b style="font-size: 14px">{{m.name}}</b><span style="font-size: 12px; color: #9ea3ad">{{m.btn}}</span></span>
            <button type="button" aria-label="Turn on or off" onClick="{{m.flip}}" style="{{m.track}}"><span style="{{m.knob}}"></span></button>
          </div>
        </sc-for>
      </aside>
      <section style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <div style="{{sky}}">
          <div style="{{ground}}"></div>
          <sc-if value="{{isWater}}" hint-placeholder-val="{{ false }}"><div style="{{waterStyle}}"></div></sc-if>
          <sc-if value="{{wallShow}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; left: 560px; top: 120px; width: 70px; height: 220px; background: #8b93a3; border-radius: 6px"></div></sc-if>
          <sc-if value="{{blockShow}}" hint-placeholder-val="{{ false }}"><div style="{{block}}"></div></sc-if>
          <div style="{{fig}}"><span style="width: 34px; height: 28px; border-radius: 8px; background: #ffcc00"></span><span style="width: 40px; height: 34px; border-radius: 6px; background: #e8463c"></span><span style="width: 34px; height: 26px; border-radius: 4px; background: #2f3440"></span></div>
          <sc-if value="{{airShow}}" hint-placeholder-val="{{ false }}"><div style="position: absolute; right: 16px; top: 14px; display: flex; gap: 4px"><sc-for list="{{air}}" as="a" hint-placeholder-count="6"><span style="{{a}}"></span></sc-for></div></sc-if>
          <span style="position: absolute; left: 14px; top: 12px; padding: 6px 12px; border-radius: 999px; background: #141519cc; font-size: 13px; font-weight: 600">{{label}}</span>
        </div>
        <div class="card" style="display: flex; flex-wrap: wrap; gap: 18px">
          <sc-for list="{{tunes}}" as="t" hint-placeholder-count="3"><label class="fld" style="flex: 1 1 180px">{{t.name}} · {{t.val}}<input type="range" min="1" max="10" value="{{t.val}}" onInput="{{t.set}}" style="accent-color: #ffcc00"></label></sc-for>
        </div>
      </section>
      <aside class="card" style="flex: 1 1 260px; max-width: 300px; display: flex; flex-direction: column; gap: 12px">
        <span class="lbl">Water</span>
        <div style="display: flex; flex-direction: column; gap: 6px"><sc-for list="{{waters}}" as="w" hint-placeholder-count="4"><button type="button" style="{{w.style}}" onClick="{{w.pick}}"><b>{{w.name}}</b><span style="font-size: 12px; opacity: .85">{{w.desc}}</span></button></sc-for></div>
        <label class="fld">River current · {{current}}<input type="range" min="0" max="10" value="{{current}}" onInput="{{setCurrent}}" style="accent-color: #ffcc00"></label>
        <label class="fld">Air under water · {{airSec}} s<input type="range" min="5" max="60" step="5" value="{{airSec}}" onInput="{{setAir}}" style="accent-color: #ffcc00"></label>
        <span style="font-size: 13px; color: #9ea3ad; line-height: 1.5">Paint water in Scene with the Water brush. Deep water needs Swim or Dive to cross.</span>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const H = {
  at: (e) => { const r = e.currentTarget.closest('[data-stage]').getBoundingClientRect(); return [Math.min(e.clientX - r.left, r.width - 250), Math.min(e.clientY - r.top, r.height - 260)]; },
  menu: (m, title, items) => (m ? { show: true, title, style: 'left: ' + m.x + 'px; top: ' + m.y + 'px', items } : { show: false, title: '', items: [] }),
  toast: (t) => (t ? { show: true, text: t } : { show: false, text: '' }),
  pick: (on) => 'min-height: 38px; padding: 0 14px; border-radius: 10px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: ' + (on ? '#141519' : '#f2f2f4') + '; background: ' + (on ? '#ffcc00' : '#24262d'),
  card: (on) => 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: #f2f2f4; background: ' + (on ? '#3a3420' : '#24262d') + '; box-shadow: ' + (on ? 'inset 0 0 0 2px #ffcc00' : 'none'),
  track: (on) => 'flex: 0 0 auto; width: 46px; height: 28px; border-radius: 14px; position: relative; background: ' + (on ? '#ffcc00' : '#33363e'),
  knob: (on) => 'position: absolute; top: 3px; left: ' + (on ? 21 : 3) + 'px; width: 22px; height: 22px; border-radius: 50%; background: #fff',
  tab: (on) => (on ? 'ltab lon' : 'ltab'),
  sw: (c, on, size) => 'width: ' + (size || 30) + 'px; height: ' + (size || 30) + 'px; border-radius: 8px; border: none; cursor: pointer; background: ' + c + '; box-shadow: ' + (on ? '0 0 0 3px #141519, 0 0 0 5px #fff' : 'none')
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.M = [['Jump', 'A', true], ['Double jump', 'A in the air', false], ['Back flip', 'Hold Defend + A', true], ['Roll / dodge', 'B while moving', true], ['Defend', 'Hold R', true], ['Climb', 'Walk into a wall', true], ['Push and pull', 'Hold near a block', true], ['Lift and throw', 'B near a pot', true], ['Sprint', 'Hold L', false], ['Glide', 'Hold A when falling', false], ['Swim', 'Automatic in water', true], ['Dive under', 'B while swimming', true]];
    this.state = { cur: 'Back flip', on: Object.fromEntries(this.M.map((m) => [m[0], m[2]])), t: 0, water: 'River', current: 4, air: 20, tune: { 'Jump height': 6, 'Run speed': 5, 'Swim speed': 4 } };
    this.tm = setInterval(() => this.setState({ t: (this.state.t + 0.025) % 1 }), 40);
  }
  renderVals() {
    const s = this.state;
    const t = s.t; const cur = s.cur;
    const water = cur === 'Swim' || cur === 'Dive under';
    const jh = s.tune['Jump height'] * 18;
    let x = 160 + t * 300, y = 260, rot = 0;
    if (cur === 'Jump') y = 260 - Math.sin(t * Math.PI) * jh;
    if (cur === 'Double jump') y = 260 - (t < 0.5 ? Math.sin(t * 2 * Math.PI) * jh : Math.sin((t - 0.5) * 2 * Math.PI) * jh * 1.3 + 0);
    if (cur === 'Back flip') { x = 360 - t * 140; y = 260 - Math.sin(t * Math.PI) * jh * 1.3; rot = -t * 360; }
    if (cur === 'Roll / dodge') { y = 290; rot = t * 720; }
    if (cur === 'Defend') x = 300;
    if (cur === 'Climb') { x = 520; y = 260 - t * 160; }
    if (cur === 'Push and pull') x = 200 + t * 160;
    if (cur === 'Lift and throw') x = 300;
    if (cur === 'Sprint') x = 60 + t * 600;
    if (cur === 'Glide') { x = 100 + t * 500; y = 60 + t * 200; }
    if (cur === 'Swim') { y = 236 + Math.sin(t * 12) * 4; x = 100 + t * 500 + (s.water === 'River' ? t * s.current * 10 : 0); }
    if (cur === 'Dive under') { x = 160 + t * 400; y = 260 + Math.sin(t * Math.PI) * 110; }
    const airLeft = cur === 'Dive under' ? Math.max(0, 6 - Math.floor(t * 6 * 20 / s.air)) : 6;
    const btn = (m) => m[1];
    return {
      moves: this.M.map((m) => ({ name: m[0], btn: s.on[m[0]] ? btn(m) : 'Off',
        row: 'display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; cursor: pointer; background: ' + (m[0] === cur ? '#3a3420' : '#24262d') + '; box-shadow: ' + (m[0] === cur ? 'inset 0 0 0 2px #ffcc00' : 'none'),
        pick: () => this.setState({ cur: m[0], t: 0 }),
        flip: (e) => { e.stopPropagation(); this.setState({ on: Object.assign({}, s.on, { [m[0]]: !s.on[m[0]] }) }); },
        track: H.track(s.on[m[0]]) + '; border: none; cursor: pointer', knob: H.knob(s.on[m[0]]) })),
      sky: 'position: relative; height: 420px; border-radius: 20px; overflow: hidden; background: ' + (water && s.water === 'Sea' ? 'linear-gradient(#7cb7e6 0 50%, #0b3550 50%)' : 'linear-gradient(#7cb7e6, #bfe0f7)'),
      ground: 'position: absolute; left: 0; right: 0; top: 340px; bottom: 0; background: #3f8f4a',
      isWater: water, waterStyle: 'position: absolute; left: 0; right: 0; top: 250px; bottom: 0; background: ' + (s.water === 'Pool' ? '#4fc3f7cc' : s.water === 'Sea' ? '#0b4a6ecc' : '#2a6f9ecc') + (s.water === 'River' ? '; background-image: repeating-linear-gradient(90deg, #ffffff22 0 20px, transparent 20px 60px); background-position: ' + (t * s.current * 60) + 'px 0' : ''),
      wallShow: cur === 'Climb', blockShow: cur === 'Push and pull' || cur === 'Lift and throw',
      block: 'position: absolute; left: ' + (cur === 'Push and pull' ? 260 + t * 160 : 300 + (t > 0.5 ? (t - 0.5) * 500 : 0)) + 'px; top: ' + (cur === 'Lift and throw' ? (t < 0.5 ? 200 : 200 - Math.sin((t - 0.5) * 2 * Math.PI) * 80) : 280) + 'px; width: 60px; height: 60px; border-radius: 8px; background: ' + (cur === 'Lift and throw' ? '#c9893f' : '#a3a9b4'),
      fig: 'position: absolute; left: ' + x + 'px; top: ' + y + 'px; display: flex; flex-direction: column; align-items: center; transform: rotate(' + rot + 'deg)' + (cur === 'Swim' || cur === 'Dive under' || cur === 'Glide' ? ' rotate(80deg)' : '') + (cur === 'Defend' ? '; box-shadow: 24px 0 0 -6px #c9893f' : ''),
      airShow: cur === 'Dive under', air: Array.from({ length: 6 }, (_, i) => 'width: 16px; height: 16px; border-radius: 50%; border: 2px solid #fff; background: ' + (i < airLeft ? '#7cc7ff' : 'transparent')),
      label: cur + (s.on[cur] ? '' : ' · turned off'),
      tunes: Object.keys(s.tune).map((k) => ({ name: k, val: s.tune[k], set: (e) => this.setState({ tune: Object.assign({}, s.tune, { [k]: +e.target.value }) }) })),
      waters: [['Pool', 'Calm, see the bottom'], ['River', 'Pushes you along'], ['Sea', 'Deep, waves, air meter'], ['Lava', 'Hurts! Needs a fire suit']].map(([n, d]) => ({ name: n, desc: d, style: H.card(n === s.water), pick: () => this.setState({ water: n, cur: n === 'Sea' ? 'Dive under' : 'Swim', t: 0 }) })),
      current: s.current, setCurrent: (e) => this.setState({ current: +e.target.value }),
      airSec: s.air, setAir: (e) => this.setState({ air: +e.target.value }),
      undo: () => {}
    };
  }
}
</script>
</body>
</html>
