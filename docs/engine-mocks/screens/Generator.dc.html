<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Generator</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141519}
a{color:#ffcc00}a:hover{color:#ffd633}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:none;background:#24262d;color:#f2f2f4;font:600 14px 'Figtree',sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:#2c2f37;color:#fff}
.pri{background:#ffcc00;color:#141519}
.pri:hover{background:#ffd633;color:#141519}
.ico{width:40px;padding:0}
.card{background:#1d1f25;border-radius:20px;padding:18px}
.ltab{padding:8px 14px;border-radius:10px;border:none;background:none;color:#9ea3ad;font:600 14px 'Figtree',sans-serif;cursor:pointer}
.ltab:hover{color:#f2f2f4}
.lon{background:#24262d;color:#f2f2f4}
.tilelib{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;padding:10px 6px;border-radius:14px;background:#24262d;color:#f2f2f4;font:600 12px 'Figtree',sans-serif;cursor:grab;user-select:none;text-align:center}
.tilelib:hover{background:#2c2f37}
.menu{position:absolute;z-index:30;min-width:220px;padding:6px;border-radius:14px;background:#24262d;box-shadow:0 16px 40px #000a;display:flex;flex-direction:column}
.mi{display:flex;justify-content:space-between;gap:16px;padding:9px 12px;border:none;border-radius:9px;background:none;color:#f2f2f4;font:500 14px 'Figtree',sans-serif;text-align:left;cursor:pointer}
.mi:hover{background:#ffcc0026}
.sep{height:1px;background:#33363e;margin:4px 8px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#9ea3ad}
.inp{min-height:40px;padding:0 12px;border-radius:10px;border:none;background:#141519;color:#f2f2f4;font:15px 'Figtree',sans-serif}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#2c2f37;font-size:13px;color:#f2f2f4;border:none;font-family:'Figtree',sans-serif;cursor:grab}
.lbl{font-size:13px;font-weight:700;color:#9ea3ad;letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#1d1f25}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:14px;background:#24262d;box-shadow:0 10px 30px #0008;font-size:14px;z-index:40}
</style>
</helmet>
<div style="display: flex; min-height: 900px; background: #141519; color: #f2f2f4; font-family: 'Figtree', system-ui, sans-serif">
  <dc-import name="Nav" active="scene" hint-size="96px,900px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px">
      <div style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">Make a world for me</span><span style="font-size: 13px; color: #9ea3ad">Pick a recipe and watch it build, step by step. Everything it makes can be changed.</span></div>
      
      <span style="flex: 1 1 auto"></span>
      
      <a class="btn" href="Brix.dc.html">Ask Brix</a>
      <button type="button" class="btn pri" onClick="{{go}}">{{goLabel}}</button>
    </header>
    <dc-import name="Sub" group="scene" active="Generator" hint-size="900px,46px"></dc-import>
    <div data-stage="1" style="position: relative; display: flex; flex-wrap: wrap; gap: 14px; padding: 0 20px 20px; flex: 1 1 auto">
      <aside class="card" style="flex: 0 0 250px; display: flex; flex-direction: column; gap: 8px; max-height: 820px; overflow: auto; box-sizing: border-box">
        <span class="lbl">Recipe</span>
        <sc-for list="{{recipes}}" as="r" hint-placeholder-count="6"><button type="button" style="{{r.style}}" onClick="{{r.pick}}"><b>{{r.name}}</b><span style="font-size: 12px; opacity: .8">{{r.desc}}</span></button></sc-for>
      </aside>
      <section style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <div style="{{mapStyle}}"><sc-for list="{{tiles}}" as="t" hint-placeholder-count="96"><span style="{{t}}"></span></sc-for></div>
        <div class="card" style="display: flex; flex-direction: column; gap: 6px">
          <sc-for list="{{steps}}" as="st" hint-placeholder-count="6"><div style="{{st.row}}"><span style="{{st.dot}}">{{st.mark}}</span><span style="flex: 1 1 auto">{{st.name}}</span><button type="button" onClick="{{st.flip}}" style="{{st.skip}}">{{st.skipLabel}}</button></div></sc-for>
        </div>
      </section>
      <aside class="card" style="flex: 1 1 260px; max-width: 300px; display: flex; flex-direction: column; gap: 14px; max-height: 820px; overflow: auto; box-sizing: border-box">
        <div class="fld">Land<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px"><sc-for list="{{lands}}" as="l" hint-placeholder-count="6"><button type="button" style="{{l.style}}" onClick="{{l.pick}}">{{l.name}}</button></sc-for></div></div>
        <label class="fld">Size · {{sizeWord}}<input type="range" min="1" max="3" value="{{size}}" onInput="{{setSize}}" style="accent-color: #ffcc00"></label>
        <label class="fld">How hard · {{hardWord}}<input type="range" min="1" max="3" value="{{hard}}" onInput="{{setHard}}" style="accent-color: #ffcc00"></label>
        <div class="fld">Seed<div style="display: flex; gap: 6px"><input class="inp" style="flex: 1 1 auto" value="{{seed}}" readonly><button type="button" class="btn" onClick="{{reroll}}">New</button></div></div>
        <span style="font-size: 12px; color: #9ea3ad; line-height: 1.5">The same seed always makes the same world, so you can share it.</span>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const H = {
  at: (e) => { const r = e.currentTarget.closest('[data-stage]').getBoundingClientRect(); return [Math.min(e.clientX - r.left, r.width - 250), Math.min(e.clientY - r.top, r.height - 260)]; },
  menu: (m, title, items) => (m ? { show: true, title, style: 'left: ' + m.x + 'px; top: ' + m.y + 'px', items } : { show: false, title: '', items: [] }),
  toast: (t) => (t ? { show: true, text: t } : { show: false, text: '' }),
  pick: (on) => 'min-height: 38px; padding: 0 14px; border-radius: 10px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: ' + (on ? '#141519' : '#f2f2f4') + '; background: ' + (on ? '#ffcc00' : '#24262d'),
  card: (on) => 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: #f2f2f4; background: ' + (on ? '#3a3420' : '#24262d') + '; box-shadow: ' + (on ? 'inset 0 0 0 2px #ffcc00' : 'none'),
  track: (on) => 'flex: 0 0 auto; width: 46px; height: 28px; border-radius: 14px; position: relative; background: ' + (on ? '#ffcc00' : '#33363e'),
  knob: (on) => 'position: absolute; top: 3px; left: ' + (on ? 21 : 3) + 'px; width: 22px; height: 22px; border-radius: 50%; background: #fff',
  tab: (on) => (on ? 'ltab lon' : 'ltab'),
  sw: (c, on, size) => 'width: ' + (size || 30) + 'px; height: ' + (size || 30) + 'px; border-radius: 8px; border: none; cursor: pointer; background: ' + c + '; box-shadow: ' + (on ? '0 0 0 3px #141519, 0 0 0 5px #fff' : 'none')
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { recipe: 'Little dungeon', land: 'Grassland', size: 2, hard: 2, seed: 4217, step: -1, skip: {} };
  }
  renderVals() {
    const s = this.state;
    const R = { 'Little dungeon': ['Rooms, keys and a boss', ['Lay out 5 rooms', 'Connect them with doors', 'Add a key and a locked door', 'Place puzzles: blocks, switches, a pile', 'Add enemies', 'Put the boss at the end']], 'Treasure hunt': ['Explore and collect', ['Shape the land', 'Scatter trees and rocks', 'Hide 20 coins', 'Add a village', 'Place the treasure']], 'Race track': ['A loop with checkpoints', ['Draw the loop', 'Add curves and a ramp', 'Place checkpoints', 'Add racers', 'Build the stands']], 'Sky islands': ['Platforms in the air', ['Float 8 islands', 'Add moving platforms', 'Place stars', 'Add a goal flag']], 'Soccer pitch': ['A match ready to play', ['Lay the pitch', 'Add goals', 'Add two teams', 'Set the clock']], 'RPG town': ['Shops, inn and quests', ['Place streets', 'Build shops and an inn', 'Add villagers', 'Pin quests to the board']] };
    const LAND = { Grassland: '#3f8f4a', Desert: '#d8b36a', Snow: '#e6eef5', Volcano: '#4a2d33', Beach: '#7cc7ff', Space: '#1a1440' };
    const r = R[s.recipe];
    const n = r[1].length;
    let seed = s.seed; const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const done = Math.max(0, s.step + 1);
    const cols = 12, rows = 8;
    const tiles = Array.from({ length: cols * rows }, (_, i) => { const v = rnd(); const stage = Math.floor(v * n); const shown = stage < done && !s.skip[stage];
      const c = !shown ? LAND[s.land] : ['#8b93a3', '#8a5a2b', '#ffcc00', '#ff8a3d', '#e8463c', '#a78bfa'][stage % 6];
      return 'aspect-ratio: 1; border-radius: 4px; background: ' + (v < 0.55 ? LAND[s.land] : c) + '; opacity: ' + (s.step < 0 ? 0.5 : 1) + '; transition: background .3s'; });
    return {
      recipes: Object.keys(R).map((k) => ({ name: k, desc: R[k][0], style: H.card(k === s.recipe), pick: () => this.setState({ recipe: k, step: -1, skip: {} }) })),
      mapStyle: 'display: grid; grid-template-columns: repeat(' + cols + ', 1fr); gap: 3px; padding: 10px; border-radius: 20px; background: #17191e',
      tiles,
      steps: r[1].map((t, i) => ({ name: t, mark: s.skip[i] ? '–' : i < done ? '✓' : i + 1, skipLabel: s.skip[i] ? 'Include' : 'Skip',
        row: 'display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 10px; font-size: 14px; background: ' + (i === s.step ? '#3a3420' : 'transparent') + '; opacity: ' + (s.skip[i] ? 0.5 : 1),
        dot: 'flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #141519; background: ' + (i < done && !s.skip[i] ? '#45c46e' : i === s.step ? '#ffcc00' : '#33363e'),
        skip: 'min-height: 28px; padding: 0 10px; border-radius: 8px; border: none; cursor: pointer; font: 600 12px Figtree, sans-serif; background: #24262d; color: #9ea3ad',
        flip: () => this.setState({ skip: Object.assign({}, s.skip, { [i]: !s.skip[i] }) }) })),
      go: () => { if (s.step >= n - 1) { this.setState({ step: -1 }); return; } clearInterval(this.tm); let k = s.step; this.tm = setInterval(() => { k++; if (k >= n) { clearInterval(this.tm); return; } this.setState({ step: k }); }, 700); },
      goLabel: s.step >= n - 1 ? 'Start over' : s.step >= 0 ? 'Building…' : 'Build it',
      lands: Object.keys(LAND).map((l) => ({ name: l, style: H.pick(l === s.land) + '; font-size: 13px; text-align: center', pick: () => this.setState({ land: l }) })),
      size: s.size, sizeWord: ['', 'Small', 'Medium', 'Big'][s.size], setSize: (e) => this.setState({ size: +e.target.value }),
      hard: s.hard, hardWord: ['', 'Easy', 'Normal', 'Hard'][s.hard], setHard: (e) => this.setState({ hard: +e.target.value }),
      seed: s.seed, reroll: () => this.setState({ seed: Math.floor(Math.random() * 9000) + 1000, step: -1 }),
      undo: () => {}
    };
  }
}
</script>
</body>
</html>
