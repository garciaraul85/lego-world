<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Menus</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141519}
a{color:#ffcc00}a:hover{color:#ffd633}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:none;background:#24262d;color:#f2f2f4;font:600 14px 'Figtree',sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:#2c2f37;color:#fff}
.pri{background:#ffcc00;color:#141519}
.pri:hover{background:#ffd633;color:#141519}
.ico{width:40px;padding:0}
.card{background:#1d1f25;border-radius:20px;padding:18px}
.ltab{padding:8px 14px;border-radius:10px;border:none;background:none;color:#9ea3ad;font:600 14px 'Figtree',sans-serif;cursor:pointer}
.ltab:hover{color:#f2f2f4}
.lon{background:#24262d;color:#f2f2f4}
.tilelib{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;padding:10px 6px;border-radius:14px;background:#24262d;color:#f2f2f4;font:600 12px 'Figtree',sans-serif;cursor:grab;user-select:none;text-align:center}
.tilelib:hover{background:#2c2f37}
.menu{position:absolute;z-index:30;min-width:220px;padding:6px;border-radius:14px;background:#24262d;box-shadow:0 16px 40px #000a;display:flex;flex-direction:column}
.mi{display:flex;justify-content:space-between;gap:16px;padding:9px 12px;border:none;border-radius:9px;background:none;color:#f2f2f4;font:500 14px 'Figtree',sans-serif;text-align:left;cursor:pointer}
.mi:hover{background:#ffcc0026}
.sep{height:1px;background:#33363e;margin:4px 8px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#9ea3ad}
.inp{min-height:40px;padding:0 12px;border-radius:10px;border:none;background:#141519;color:#f2f2f4;font:15px 'Figtree',sans-serif}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#2c2f37;font-size:13px;color:#f2f2f4;border:none;font-family:'Figtree',sans-serif;cursor:grab}
.lbl{font-size:13px;font-weight:700;color:#9ea3ad;letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#1d1f25}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:14px;background:#24262d;box-shadow:0 10px 30px #0008;font-size:14px;z-index:40}
</style>
</helmet>
<div style="display: flex; min-height: 900px; background: #141519; color: #f2f2f4; font-family: 'Figtree', system-ui, sans-serif">
  <dc-import name="Nav" active="screens" hint-size="96px,900px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px">
      <div style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">Game menus</span><span style="font-size: 13px; color: #9ea3ad">Inventory, map, save slots, endings and more. Pick one, then set how it looks.</span></div>
      
      <span style="flex: 1 1 auto"></span>
      
      <a class="btn" href="Brix.dc.html">Ask Brix</a>
      <a class="btn pri" href="Play.dc.html">Play</a>
    </header>
    <dc-import name="Sub" group="screens" active="Menus" hint-size="900px,46px"></dc-import>
    <div data-stage="1" style="position: relative; display: flex; flex-wrap: wrap; gap: 14px; padding: 0 20px 20px; flex: 1 1 auto">
      <aside class="card" style="flex: 0 0 220px; display: flex; flex-direction: column; gap: 6px">
        <sc-for list="{{menus}}" as="m" hint-placeholder-count="10"><button type="button" style="{{m.style}}" onClick="{{m.pick}}">{{m.name}}</button></sc-for>
      </aside>
      <section style="flex: 999 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
        <div style="{{frame}}">
          <div style="{{panel}}">
            <b style="{{titleStyle}}">{{title}}</b>
            <sc-if value="{{isGrid}}" hint-placeholder-val="{{ true }}"><div style="{{grid}}"><sc-for list="{{cells}}" as="c" hint-placeholder-count="12"><span style="{{c.style}}" title="{{c.name}}"></span></sc-for></div></sc-if>
            <sc-if value="{{isWheel}}" hint-placeholder-val="{{ false }}"><div style="position: relative; width: 260px; height: 260px; margin: 0 auto"><sc-for list="{{wheel}}" as="w" hint-placeholder-count="8"><span style="{{w}}"></span></sc-for><span style="position: absolute; left: 105px; top: 105px; width: 50px; height: 50px; border-radius: 50%; background: #141519; border: 3px solid #ffcc00"></span></div></sc-if>
            <sc-if value="{{isList}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; gap: 8px"><sc-for list="{{rows}}" as="r" hint-placeholder-count="4"><div style="{{r.style}}"><span>{{r.a}}</span><span style="opacity: .75">{{r.b}}</span></div></sc-for></div></sc-if>
            <sc-if value="{{isMap}}" hint-placeholder-val="{{ false }}"><div style="display: grid; grid-template-columns: repeat(5, 70px); gap: 6px; justify-content: center"><sc-for list="{{rooms}}" as="r" hint-placeholder-count="15"><span style="{{r}}"></span></sc-for></div></sc-if>
            <sc-if value="{{isCard}}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 0"><span style="font-size: 40px; font-weight: 800">{{cardBig}}</span><span style="font-size: 18px; opacity: .8">{{cardSmall}}</span><span style="font-size: 28px; color: #ffcc00">{{stars}}</span></div></sc-if>
          </div>
        </div>
        <span style="font-size: 13px; color: #9ea3ad">{{hint}}</span>
      </section>
      <aside class="card" style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; gap: 14px">
        <div class="fld">Look<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px"><sc-for list="{{looks}}" as="l" hint-placeholder-count="5"><button type="button" style="{{l.style}}" onClick="{{l.pick}}">{{l.name}}</button></sc-for></div></div>
        <sc-for list="{{parts}}" as="p" hint-placeholder-count="4"><button type="button" onClick="{{p.flip}}" style="display: flex; align-items: center; justify-content: space-between; padding: 0; border: none; background: none; color: #f2f2f4; font: 500 14px Figtree, sans-serif; cursor: pointer"><span>{{p.name}}</span><span style="{{p.track}}"><span style="{{p.knob}}"></span></span></button></sc-for>
        <sc-if value="{{isEndings}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 8px"><span class="lbl">Which ending plays</span><sc-for list="{{endings}}" as="e" hint-placeholder-count="3"><div style="padding: 10px 12px; border-radius: 10px; background: #24262d; font-size: 14px"><b>{{e.name}}</b><br><span style="color: #9ea3ad; font-size: 12px">{{e.when}}</span></div></sc-for></div>
        </sc-if>
        <label class="fld">Opens with<select class="inp"><option>{{opens}}</option><option>A button on the HUD</option><option>A rule</option></select></label>
        <a class="btn" href="Screens.dc.html">Edit freely in the screen editor</a>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const H = {
  at: (e) => { const r = e.currentTarget.closest('[data-stage]').getBoundingClientRect(); return [Math.min(e.clientX - r.left, r.width - 250), Math.min(e.clientY - r.top, r.height - 260)]; },
  menu: (m, title, items) => (m ? { show: true, title, style: 'left: ' + m.x + 'px; top: ' + m.y + 'px', items } : { show: false, title: '', items: [] }),
  toast: (t) => (t ? { show: true, text: t } : { show: false, text: '' }),
  pick: (on) => 'min-height: 38px; padding: 0 14px; border-radius: 10px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: ' + (on ? '#141519' : '#f2f2f4') + '; background: ' + (on ? '#ffcc00' : '#24262d'),
  card: (on) => 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: #f2f2f4; background: ' + (on ? '#3a3420' : '#24262d') + '; box-shadow: ' + (on ? 'inset 0 0 0 2px #ffcc00' : 'none'),
  track: (on) => 'flex: 0 0 auto; width: 46px; height: 28px; border-radius: 14px; position: relative; background: ' + (on ? '#ffcc00' : '#33363e'),
  knob: (on) => 'position: absolute; top: 3px; left: ' + (on ? 21 : 3) + 'px; width: 22px; height: 22px; border-radius: 50%; background: #fff',
  tab: (on) => (on ? 'ltab lon' : 'ltab'),
  sw: (c, on, size) => 'width: ' + (size || 30) + 'px; height: ' + (size || 30) + 'px; border-radius: 8px; border: none; cursor: pointer; background: ' + c + '; box-shadow: ' + (on ? '0 0 0 3px #141519, 0 0 0 5px #fff' : 'none')
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cur: 'Inventory', look: 'Adventure', parts: {} };
  }
  renderVals() {
    const s = this.state;
    const M = {
      Inventory: ['grid', 'Items', 'Pause → Items', ['Show item names', 'Show amounts', 'Group by kind', 'Drag to reorder']],
      Equipment: ['list', 'Equipment', 'Pause → Gear', ['Show stats', 'Compare when hovering', 'Show outfit preview', 'Lock during fights']],
      'Item wheel': ['wheel', '', 'Hold the item button', ['Slow time while open', 'Show ammo', 'Remember last item', 'Pin favourites']],
      Map: ['map', 'Little dungeon', 'Map button', ['Show where you are', 'Show chests', 'Only rooms you visited', 'Quest markers']],
      'Save slots': ['list', 'Choose a file', 'Title → Continue', ['Show time played', 'Show a picture', 'Copy and delete files', 'Show completion %']],
      Settings: ['list', 'Settings', 'Pause → Settings', ['Volume', 'Controls', 'Accessibility', 'Language']],
      Endings: ['card', 'The end', 'When the game ends', ['Play credits after', 'Show completion', 'Return to title', 'Unlock new game plus']],
      'Chapter card': ['card', '', 'A rule or a new map', ['Show chapter number', 'Fade in and out', 'Play a sound', 'Skip button']],
      'Level complete': ['card', '', 'When a level is won', ['Stars', 'Time', 'Coins collected', 'Retry button']],
      'High scores': ['list', 'High scores', 'Title → Scores', ['Top 10', 'Player initials', 'Per level', 'Show your best']]
    };
    const m = M[s.cur]; const kind = m[0];
    const L = { Adventure: ['#2a1d10ee', '#f2e6c8', '#ffcc00', '10px', '4px solid #c9893f'], Arcade: ['#101a3aee', '#ffffff', '#ff7eb6', '0', '4px solid #7cc7ff'], RPG: ['#1a1440ee', '#e8e3ff', '#a78bfa', '6px', '3px double #d9ccff'], 'Sci-fi': ['#061a1aee', '#bff7f2', '#45e6d0', '2px', '2px solid #45e6d0'], Story: ['#ffffffee', '#2f3440', '#e8463c', '18px', 'none'] };
    const l = L[s.look];
    const on = (n, i) => (s.parts[s.cur + n] !== undefined ? s.parts[s.cur + n] : i < 3);
    const ITEM_C = ['#d8d8d8', '#8a5a2b', '#ffcc00', '#2f3440', '#ffd633', '#e8463c', '#7cc7ff', '#45c46e', '#a78bfa', '#c9893f', '#ff7eb6', '#8b93a3'];
    const rowsFor = { Equipment: [['Sword', 'Power 2'], ['Wooden shield', 'Blocks front'], ['Red tunic', 'Defence +1'], ['Boots', 'Speed +1']], 'Save slots': [['File 1 · Raul', '4 h 12 m · 62%'], ['File 2 · Empty', ''], ['File 3 · Kid', '0 h 40 m · 8%']], Settings: [['Music', '80%'], ['Sound effects', '90%'], ['Controls', 'Change…'], ['Accessibility', 'Change…']], 'High scores': [['1. RAU', '12,400'], ['2. KID', '9,800'], ['3. MOM', '7,150'], ['4. DAD', '2,300']] };
    const cards = { Endings: ['The bridge holds', 'Good ending · you saved the village', '★★★'], 'Chapter card': ['Chapter 2', 'The Chasm Hall', ''], 'Level complete': ['Level complete!', 'Time 2:41 · 48 of 50 coins', '★★☆'] };
    return {
      menus: Object.keys(M).map((n) => ({ name: n, style: H.pick(n === s.cur), pick: () => this.setState({ cur: n }) })),
      frame: 'position: relative; aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #2d4a33 radial-gradient(#3b5c42 2px, transparent 2px) 0 0 / 20px 20px',
      panel: 'min-width: 56%; max-width: 80%; padding: 22px; border-radius: ' + l[3] + '; border: ' + l[4] + '; background: ' + l[0] + '; color: ' + l[1] + '; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px #0008' + (s.look === 'Sci-fi' ? '; font-family: ui-monospace, monospace' : ''),
      titleStyle: 'font-size: 22px; color: ' + l[2] + (m[1] ? '' : '; display: none'),
      title: m[1],
      isGrid: kind === 'grid', isWheel: kind === 'wheel', isList: kind === 'list', isMap: kind === 'map', isCard: kind === 'card', isEndings: s.cur === 'Endings',
      grid: 'display: grid; grid-template-columns: repeat(6, 56px); gap: 8px; justify-content: center',
      cells: ITEM_C.map((c, i) => ({ name: 'Slot ' + (i + 1), style: 'width: 56px; height: 56px; border-radius: ' + l[3] + '; border: 2px solid ' + (i === 2 ? l[2] : '#ffffff22') + '; background: radial-gradient(' + (i < 9 ? c : 'transparent') + ' 0 38%, #0003 40%)' })),
      wheel: ITEM_C.slice(0, 8).map((c, i) => { const a = i / 8 * Math.PI * 2; return 'position: absolute; left: ' + (110 + Math.cos(a) * 100) + 'px; top: ' + (110 + Math.sin(a) * 100) + 'px; width: 40px; height: 40px; border-radius: 50%; background: ' + c + '; border: 3px solid ' + (i === 0 ? l[2] : '#141519'); }),
      rows: (rowsFor[s.cur] || []).map(([a, b], i) => ({ a, b, style: 'display: flex; justify-content: space-between; gap: 24px; padding: 10px 14px; border-radius: ' + l[3] + '; background: ' + (i === 0 ? l[2] + '33' : '#ffffff0f') })),
      rooms: Array.from({ length: 15 }, (_, i) => 'height: 46px; border-radius: 6px; background: ' + ([1, 2, 6, 7, 8, 12].indexOf(i) >= 0 ? (i === 7 ? l[2] : '#ffffff55') : '#ffffff10') + (i === 13 ? '; box-shadow: inset 0 0 0 3px #e8463c' : '')),
      cardBig: (cards[s.cur] || ['', '', ''])[0], cardSmall: (cards[s.cur] || ['', '', ''])[1], stars: (cards[s.cur] || ['', '', ''])[2],
      hint: 'Opens with: ' + m[2] + '. This is how it looks in the game.',
      looks: Object.keys(L).map((k) => ({ name: k, style: H.pick(k === s.look) + '; font-size: 13px; text-align: center', pick: () => this.setState({ look: k }) })),
      parts: m[3].map((n, i) => ({ name: n, flip: () => this.setState({ parts: Object.assign({}, s.parts, { [s.cur + n]: !on(n, i) }) }), track: H.track(on(n, i)), knob: H.knob(on(n, i)) })),
      endings: [['Good ending', 'If the bridge was built and the Stone King beaten'], ['Bad ending', 'If the village was left in the dark'], ['Secret ending', 'If all 50 coins were found']].map(([n, w]) => ({ name: n, when: w })),
      opens: m[2],
      undo: () => {}
    };
  }
}
</script>
</body>
</html>
