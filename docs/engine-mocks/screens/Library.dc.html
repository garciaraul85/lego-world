<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141519}
a{color:#ffcc00}a:hover{color:#ffd633}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:none;background:#24262d;color:#f2f2f4;font:600 14px 'Figtree',sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:#2c2f37;color:#fff}
.pri{background:#ffcc00;color:#141519}
.pri:hover{background:#ffd633;color:#141519}
.ico{width:40px;padding:0}
.card{background:#1d1f25;border-radius:20px;padding:18px}
.ltab{padding:8px 14px;border-radius:10px;border:none;background:none;color:#9ea3ad;font:600 14px 'Figtree',sans-serif;cursor:pointer}
.ltab:hover{color:#f2f2f4}
.lon{background:#24262d;color:#f2f2f4}
.tilelib{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;padding:10px 6px;border-radius:14px;background:#24262d;color:#f2f2f4;font:600 12px 'Figtree',sans-serif;cursor:grab;user-select:none;text-align:center}
.tilelib:hover{background:#2c2f37}
.menu{position:absolute;z-index:30;min-width:220px;padding:6px;border-radius:14px;background:#24262d;box-shadow:0 16px 40px #000a;display:flex;flex-direction:column}
.mi{display:flex;justify-content:space-between;gap:16px;padding:9px 12px;border:none;border-radius:9px;background:none;color:#f2f2f4;font:500 14px 'Figtree',sans-serif;text-align:left;cursor:pointer}
.mi:hover{background:#ffcc0026}
.sep{height:1px;background:#33363e;margin:4px 8px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#9ea3ad}
.inp{min-height:40px;padding:0 12px;border-radius:10px;border:none;background:#141519;color:#f2f2f4;font:15px 'Figtree',sans-serif}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#2c2f37;font-size:13px;color:#f2f2f4;border:none;font-family:'Figtree',sans-serif;cursor:grab}
.lbl{font-size:13px;font-weight:700;color:#9ea3ad;letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#1d1f25}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:14px;background:#24262d;box-shadow:0 10px 30px #0008;font-size:14px;z-index:40}
</style>
</helmet>
<div style="display: flex; min-height: 900px; background: #141519; color: #f2f2f4; font-family: 'Figtree', system-ui, sans-serif">
  <dc-import name="Nav" active="build" hint-size="96px,900px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px">
      <div style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">My library</span><span style="font-size: 13px; color: #9ea3ad">Things you saved, ready to use in any of your games</span></div>
      <input class="inp" style="width: 240px" placeholder="Search your library" value="{{q}}" onInput="{{search}}">
      <span style="flex: 1 1 auto"></span>
      
      <a class="btn" href="Brix.dc.html">Ask Brix</a>
      <a class="btn pri" href="Play.dc.html">Play</a>
    </header>
    <dc-import name="Sub" group="build" active="My library" hint-size="900px,46px"></dc-import>
    <div data-stage="1" style="position: relative; display: flex; flex-wrap: wrap; gap: 14px; padding: 0 20px 20px; flex: 1 1 auto">
      <section style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{kinds}}" as="k" hint-placeholder-count="8"><button type="button" style="{{k.style}}" onClick="{{k.pick}}">{{k.name}}</button></sc-for></div>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px">
          <sc-for list="{{items}}" as="i" hint-placeholder-count="12">
            <button type="button" draggable="true" onDragStart="{{i.start}}" style="{{i.style}}" onClick="{{i.pick}}"><span style="{{i.thumb}}"></span><b style="font-size: 14px">{{i.name}}</b><span style="font-size: 12px; color: #9ea3ad">{{i.kind}}</span></button>
          </sc-for>
        </div>
      </section>
      <aside style="flex: 1 1 300px; max-width: 340px; display: flex; flex-direction: column; gap: 14px">
        <div class="card" style="display: flex; flex-direction: column; gap: 10px">
          <span style="{{sel.thumb}}"></span>
          <b style="font-size: 20px">{{sel.name}}</b>
          <span style="font-size: 14px; color: #9ea3ad">{{sel.kind}} · used in {{sel.used}} games · saved {{sel.when}}</span>
          <div style="display: flex; gap: 8px; flex-wrap: wrap"><button type="button" class="btn pri" onClick="{{addIt}}">{{addLabel}}</button><a class="btn" href="{{sel.href}}">Open in its editor</a></div>
        </div>
        <div style="{{dropZone}}" onDragOver="{{allow}}" onDrop="{{dropIn}}" onDragEnter="{{enter}}" onDragLeave="{{leave}}"><b>Little dungeon</b><span style="font-size: 13px; color: #9ea3ad">Drop things here to add them to this game</span><span style="font-size: 13px">{{inGame}}</span></div>
        <div class="card" style="display: flex; flex-direction: column; gap: 8px">
          <span class="lbl">Share</span>
          <button type="button" class="btn" onClick="{{exportPack}}">Save selected as a pack file</button>
          <button type="button" class="btn">Open a pack file…</button>
        </div>
      </aside>
      <sc-if value="{{toast.show}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast.text}}<button type="button" class="btn" style="min-height: 34px" onClick="{{undo}}">Undo</button></div></sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const H = {
  at: (e) => { const r = e.currentTarget.closest('[data-stage]').getBoundingClientRect(); return [Math.min(e.clientX - r.left, r.width - 250), Math.min(e.clientY - r.top, r.height - 260)]; },
  menu: (m, title, items) => (m ? { show: true, title, style: 'left: ' + m.x + 'px; top: ' + m.y + 'px', items } : { show: false, title: '', items: [] }),
  toast: (t) => (t ? { show: true, text: t } : { show: false, text: '' }),
  pick: (on) => 'min-height: 38px; padding: 0 14px; border-radius: 10px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: ' + (on ? '#141519' : '#f2f2f4') + '; background: ' + (on ? '#ffcc00' : '#24262d'),
  card: (on) => 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: #f2f2f4; background: ' + (on ? '#3a3420' : '#24262d') + '; box-shadow: ' + (on ? 'inset 0 0 0 2px #ffcc00' : 'none'),
  track: (on) => 'flex: 0 0 auto; width: 46px; height: 28px; border-radius: 14px; position: relative; background: ' + (on ? '#ffcc00' : '#33363e'),
  knob: (on) => 'position: absolute; top: 3px; left: ' + (on ? 21 : 3) + 'px; width: 22px; height: 22px; border-radius: 50%; background: #fff',
  tab: (on) => (on ? 'ltab lon' : 'ltab'),
  sw: (c, on, size) => 'width: ' + (size || 30) + 'px; height: ' + (size || 30) + 'px; border-radius: 8px; border: none; cursor: pointer; background: ' + c + '; box-shadow: ' + (on ? '0 0 0 3px #141519, 0 0 0 5px #fff' : 'none')
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { kind: 'All', q: '', sel: 'Red-roof house', added: [], over: false, toast: null };
  }
  renderVals() {
    const s = this.state;
    const I = [['Red-roof house', 'Asset', '#e8463c', 4, 'Build'], ['Lighthouse', 'Asset', '#f2f2f4', 1, 'Build'], ['Old Mason', 'Character', '#6fb7f0', 2, 'Character'], ['Fox wizard', 'Character', '#ff8a3d', 1, 'Character'], ['Round window', 'Brick', '#7cc7ff', 3, 'Build'], ['Curved roof tile', 'Brick', '#b34a3c', 2, 'Build'], ['Victory dance', 'Clip', '#ffcc00', 5, 'Animate'], ['Torch fire', 'Effect', '#ff8a3d', 3, 'Effects'], ['Collect then open', 'Script', '#a78bfa', 6, 'Logic'], ['Six-legged robot', 'Body plan', '#8b93a3', 1, 'Skeleton'], ['Knight brain', 'Brain', '#e8463c', 2, 'Brain'], ['Adventure HUD', 'Screen', '#ffcc00', 3, 'Screens']];
    const kinds = ['All', 'Asset', 'Character', 'Brick', 'Clip', 'Effect', 'Script', 'Body plan', 'Brain', 'Screen'];
    const q = s.q.toLowerCase();
    const sel = I.find((x) => x[0] === s.sel) || I[0];
    const thumb = (c, h) => 'display: block; width: 100%; height: ' + h + 'px; border-radius: 12px; background: ' + c + '; background-image: radial-gradient(#ffffff30 2px, transparent 2px); background-size: 12px 12px';
    const add = (n) => { if (s.added.indexOf(n) >= 0) return; this.setState({ added: s.added.concat([n]), toast: n + ' added to Little dungeon' }); };
    return {
      q: s.q, search: (e) => this.setState({ q: e.target.value }),
      kinds: kinds.map((k) => ({ name: k === 'All' ? 'All' : k + 's', style: H.pick(k === s.kind) + '; min-height: 32px; border-radius: 999px; font-size: 13px', pick: () => this.setState({ kind: k }) })),
      items: I.filter((x) => (s.kind === 'All' || x[1] === s.kind) && (!q || x[0].toLowerCase().indexOf(q) >= 0)).map((x) => ({ name: x[0], kind: x[1], thumb: thumb(x[2], 80),
        style: H.card(x[0] === sel[0]) + '; gap: 6px; cursor: grab', pick: () => this.setState({ sel: x[0] }), start: (e) => e.dataTransfer.setData('text/plain', x[0]) })),
      sel: { name: sel[0], kind: sel[1], used: sel[3], when: 'last week', thumb: thumb(sel[2], 150), href: sel[4] + '.dc.html' },
      addIt: () => add(sel[0]), addLabel: s.added.indexOf(sel[0]) >= 0 ? 'In this game' : 'Add to this game',
      dropZone: 'display: flex; flex-direction: column; gap: 6px; padding: 18px; border-radius: 16px; background: #1d1f25; border: 3px dashed ' + (s.over ? '#ffcc00' : '#33363e'),
      allow: (e) => e.preventDefault(), enter: () => this.setState({ over: true }), leave: () => this.setState({ over: false }),
      dropIn: (e) => { e.preventDefault(); this.setState({ over: false }); const n = e.dataTransfer.getData('text/plain'); if (n) add(n); },
      inGame: s.added.length ? 'Added: ' + s.added.join(', ') : '',
      exportPack: () => this.setState({ toast: sel[0] + ' saved as a pack file you can send to friends' }),
      toast: H.toast(s.toast),
      undo: () => this.setState({ added: s.added.slice(0, -1), toast: null })
    };
  }
}
</script>
</body>
</html>
