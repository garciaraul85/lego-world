<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Animate</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141519}
a{color:#ffcc00}a:hover{color:#ffd633}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:none;background:#24262d;color:#f2f2f4;font:600 14px 'Figtree',sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:#2c2f37;color:#fff}
.pri{background:#ffcc00;color:#141519}
.pri:hover{background:#ffd633;color:#141519}
.ico{width:40px;padding:0}
.card{background:#1d1f25;border-radius:20px;padding:18px}
.ltab{padding:8px 14px;border-radius:10px;border:none;background:none;color:#9ea3ad;font:600 14px 'Figtree',sans-serif;cursor:pointer}
.ltab:hover{color:#f2f2f4}
.lon{background:#24262d;color:#f2f2f4}
.tilelib{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;padding:10px 6px;border-radius:14px;background:#24262d;color:#f2f2f4;font:600 12px 'Figtree',sans-serif;cursor:grab;user-select:none;text-align:center}
.tilelib:hover{background:#2c2f37}
.menu{position:absolute;z-index:30;min-width:220px;padding:6px;border-radius:14px;background:#24262d;box-shadow:0 16px 40px #000a;display:flex;flex-direction:column}
.mi{display:flex;justify-content:space-between;gap:16px;padding:9px 12px;border:none;border-radius:9px;background:none;color:#f2f2f4;font:500 14px 'Figtree',sans-serif;text-align:left;cursor:pointer}
.mi:hover{background:#ffcc0026}
.sep{height:1px;background:#33363e;margin:4px 8px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#9ea3ad}
.inp{min-height:40px;padding:0 12px;border-radius:10px;border:none;background:#141519;color:#f2f2f4;font:15px 'Figtree',sans-serif}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#2c2f37;font-size:13px;color:#f2f2f4;border:none;font-family:'Figtree',sans-serif;cursor:grab}
.lbl{font-size:13px;font-weight:700;color:#9ea3ad;letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#1d1f25}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:14px;background:#24262d;box-shadow:0 10px 30px #0008;font-size:14px;z-index:40}
</style>
</helmet>
<div style="display: flex; min-height: 900px; background: #141519; color: #f2f2f4; font-family: 'Figtree', system-ui, sans-serif" onClick="{{closeMenu}}">
  <dc-import name="Nav" active="animate" hint-size="96px,900px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px">
      <div style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">Old Mason · {{moveName}}</span><span style="font-size: 13px; color: #9ea3ad">Drag the dots to pose. Each pose is a key.</span></div>
      <span style="flex: 1 1 auto"></span>
      <button type="button" class="btn ico" aria-label="Undo" onClick="{{undo}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
      <a class="btn" href="Brix.dc.html">Ask Brix</a>
      <a class="btn pri" href="Character.dc.html">Done</a>
    </header>
    <dc-import name="Sub" group="animate" active="Pose and keys" hint-size="900px,46px"></dc-import>
    <div style="display: flex; flex-wrap: wrap; gap: 14px; padding: 0 20px 20px; flex: 1 1 auto">
      <section data-stage="1" style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 14px; position: relative">
        <div style="position: relative; flex: 1 1 auto; min-height: 520px; border-radius: 20px; background: linear-gradient(#20232b, #17191e); overflow: hidden" onMouseMove="{{move}}" onMouseUp="{{up}}" onMouseLeave="{{up}}" onDragOver="{{allow}}" onDrop="{{dropPreset}}">
          <div style="position: absolute; left: 0; right: 0; top: 440px; bottom: 0; background: #1f2a22"></div>
          <sc-for list="{{onion}}" as="b" hint-placeholder-count="10"><div style="{{b}}"></div></sc-for>
          <sc-for list="{{bones}}" as="b" hint-placeholder-count="10"><div style="{{b}}"></div></sc-for>
          <div style="{{headStyle}}"></div>
          <sc-for list="{{joints}}" as="j" hint-placeholder-count="11"><span title="{{j.name}}" style="{{j.style}}" onMouseDown="{{j.down}}"></span></sc-for>
          <span style="position: absolute; left: 16px; top: 14px; font-size: 13px; color: #9ea3ad">Faint figure = the key before. Drop a preset here to use it.</span>
        </div>
        <div class="card" style="display: flex; flex-direction: column; gap: 10px; padding: 14px 18px">
          <div style="display: flex; align-items: center; gap: 10px">
            <button type="button" class="btn pri ico" aria-label="Play" onClick="{{play}}">{{playIcon}}</button>
            <button type="button" class="btn" onClick="{{addKey}}">Add key</button>
            <span style="font-size: 13px; color: #9ea3ad">Click a key to pose it. Right-click for more. Drag to move it in time.</span>
            <span style="flex: 1 1 auto"></span>
            <span style="font-size: 13px; color: #9ea3ad">{{timeText}}</span>
          </div>
          <div data-track="1" style="position: relative; height: 54px; border-radius: 12px; background: #141519" onMouseMove="{{moveKey}}" onMouseUp="{{up}}">
            <sc-for list="{{ticks}}" as="t" hint-placeholder-count="13"><span style="{{t}}"></span></sc-for>
            <span style="{{playhead}}"></span>
            <sc-for list="{{keys}}" as="k" hint-placeholder-count="4"><button type="button" aria-label="{{k.label}}" style="{{k.style}}" onMouseDown="{{k.down}}" onContextMenu="{{k.menu}}"></button></sc-for>
          </div>
        </div>
        <sc-if value="{{menu.show}}" hint-placeholder-val="{{ false }}">
          <div class="menu" style="{{menu.style}}">
            <span style="padding: 6px 12px 8px; font-size: 12px; font-weight: 700; color: #9ea3ad">This key</span>
            <sc-for list="{{menu.items}}" as="i" hint-placeholder-count="4"><button type="button" class="mi" onClick="{{i.run}}"><span>{{i.label}}</span><span style="color: #9ea3ad; font-size: 12px">{{i.key}}</span></button></sc-for>
          </div>
        </sc-if>
      </section>
      <aside style="flex: 1 1 260px; max-width: 300px; display: flex; flex-direction: column; gap: 14px">
        <div class="card" style="display: flex; flex-direction: column; gap: 10px">
          <span class="lbl">Moves</span>
          <sc-for list="{{moves}}" as="m" hint-placeholder-count="4"><button type="button" style="{{m.style}}" onClick="{{m.pick}}">{{m.name}}</button></sc-for>
        </div>
        <div class="card" style="display: flex; flex-direction: column; gap: 10px">
          <span class="lbl">Presets · drag onto the stage</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{presets}}" as="p" hint-placeholder-count="6"><span class="chip" draggable="true" onDragStart="{{p.start}}">{{p.name}}</span></sc-for></div>
        </div>
        <div class="card" style="display: flex; flex-direction: column; gap: 10px">
          <span class="lbl">Feel</span>
          <label class="fld">Speed<input type="range" min="50" max="200" value="{{speed}}" onInput="{{setSpeed}}" style="accent-color: #ffcc00"></label>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" checked style="accent-color: #ffcc00; width: 18px; height: 18px">Loop</label>
          <label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" checked style="accent-color: #ffcc00; width: 18px; height: 18px">Smooth between keys</label>
        </div>
      </aside>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const H = {
  at: (e) => { const r = e.currentTarget.closest('[data-stage]').getBoundingClientRect(); return [Math.min(e.clientX - r.left, r.width - 250), Math.min(e.clientY - r.top, r.height - 260)]; },
  menu: (m, title, items) => (m ? { show: true, title, style: 'left: ' + m.x + 'px; top: ' + m.y + 'px', items } : { show: false, title: '', items: [] }),
  toast: (t) => (t ? { show: true, text: t } : { show: false, text: '' }),
  pick: (on) => 'min-height: 38px; padding: 0 14px; border-radius: 10px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: ' + (on ? '#141519' : '#f2f2f4') + '; background: ' + (on ? '#ffcc00' : '#24262d'),
  card: (on) => 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: #f2f2f4; background: ' + (on ? '#3a3420' : '#24262d') + '; box-shadow: ' + (on ? 'inset 0 0 0 2px #ffcc00' : 'none'),
  track: (on) => 'flex: 0 0 auto; width: 46px; height: 28px; border-radius: 14px; position: relative; background: ' + (on ? '#ffcc00' : '#33363e'),
  knob: (on) => 'position: absolute; top: 3px; left: ' + (on ? 21 : 3) + 'px; width: 22px; height: 22px; border-radius: 50%; background: #fff',
  tab: (on) => (on ? 'ltab lon' : 'ltab'),
  sw: (c, on, size) => 'width: ' + (size || 30) + 'px; height: ' + (size || 30) + 'px; border-radius: 8px; border: none; cursor: pointer; background: ' + c + '; box-shadow: ' + (on ? '0 0 0 3px #141519, 0 0 0 5px #fff' : 'none')
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const base = { hip: [400, 300], chest: [400, 200], lEl: [350, 230], lHa: [330, 280], rEl: [450, 230], rHa: [470, 280], lKn: [380, 370], lFo: [375, 440], rKn: [420, 370], rFo: [425, 440] };
    const pose = (o) => { const p = {}; Object.keys(base).forEach((k) => { p[k] = (o[k] || base[k]).slice(); }); return p; };
    this.pose = pose;
    this.P = {
      Stand: pose({}),
      'Step left': pose({ lKn: [360, 360], lFo: [330, 430], rKn: [430, 375], rFo: [450, 440], lHa: [360, 290], rHa: [440, 290] }),
      'Step right': pose({ rKn: [440, 360], rFo: [470, 430], lKn: [370, 375], lFo: [350, 440], lHa: [350, 290], rHa: [450, 290] }),
      Wave: pose({ rEl: [470, 170], rHa: [500, 110] }),
      Cheer: pose({ lEl: [340, 150], lHa: [320, 90], rEl: [460, 150], rHa: [480, 90] }),
      Crouch: pose({ hip: [400, 340], chest: [405, 250], lKn: [360, 380], rKn: [440, 380], lEl: [360, 280], rEl: [445, 280], lHa: [370, 320], rHa: [430, 320] }),
      Hammer: pose({ rEl: [450, 150], rHa: [420, 100], lEl: [370, 170], lHa: [410, 110] })
    };
    this.state = { move: 'Walk', keys: [{ t: 0, p: this.P['Step left'] }, { t: 12, p: this.P.Stand }, { t: 24, p: this.P['Step right'] }, { t: 36, p: this.P.Stand }], cur: 0, drag: null, kdrag: null, time: 0, playing: false, speed: 100, menu: null, hist: [] };
  }
  renderVals() {
    const s = this.state;
    const k = s.keys[s.cur] || s.keys[0];
    const lerp = (a, b, f) => { const p = {}; Object.keys(a).forEach((j) => { p[j] = [a[j][0] + (b[j][0] - a[j][0]) * f, a[j][1] + (b[j][1] - a[j][1]) * f]; }); return p; };
    const sorted = s.keys.slice().sort((a, b) => a.t - b.t);
    const at = (t) => { for (let i = 0; i < sorted.length; i++) { const a = sorted[i], b = sorted[(i + 1) % sorted.length]; const end = i + 1 < sorted.length ? b.t : 48; if (t >= a.t && t < end) { const f = (t - a.t) / Math.max(1, end - a.t); return lerp(a.p, b.p, 0.5 - Math.cos(f * Math.PI) / 2); } } return sorted[0].p; };
    const p = s.playing ? at(s.time) : k.p;
    const prevKey = sorted[(sorted.indexOf(k) - 1 + sorted.length) % sorted.length];
    const seg = (a, b, w, col) => { const dx = b[0] - a[0], dy = b[1] - a[1]; const len = Math.sqrt(dx * dx + dy * dy); return 'position: absolute; left: ' + a[0] + 'px; top: ' + (a[1] - w / 2) + 'px; width: ' + len + 'px; height: ' + w + 'px; border-radius: ' + w + 'px; background: ' + col + '; transform-origin: 0 50%; transform: rotate(' + (Math.atan2(dy, dx) * 180 / Math.PI) + 'deg)'; };
    const B = [['hip', 'chest', 44, '#3b78c9'], ['chest', 'lEl', 20, '#3b78c9'], ['lEl', 'lHa', 18, '#ffcc00'], ['chest', 'rEl', 20, '#3b78c9'], ['rEl', 'rHa', 18, '#ffcc00'], ['hip', 'lKn', 24, '#2f3440'], ['lKn', 'lFo', 22, '#2f3440'], ['hip', 'rKn', 24, '#2f3440'], ['rKn', 'rFo', 22, '#2f3440']];
    const snapshot = () => s.hist.concat([s.keys]).slice(-30);
    const stage = (e) => { const r = e.currentTarget.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    const m = s.menu;
    return {
      moveName: s.move,
      onion: s.playing || !prevKey || prevKey === k ? [] : B.map(([a, b, w]) => seg(prevKey.p[a], prevKey.p[b], w, '#ffffff14')),
      bones: B.map(([a, b, w, c]) => seg(p[a], p[b], w, c)),
      headStyle: 'position: absolute; left: ' + (p.chest[0] - 34) + 'px; top: ' + (p.chest[1] - 74) + 'px; width: 68px; height: 60px; border-radius: 16px; background: #ffcc00; box-shadow: inset 0 -6px 0 #0002',
      joints: s.playing ? [] : Object.keys(p).map((j) => ({ name: j, style: 'position: absolute; left: ' + (p[j][0] - 10) + 'px; top: ' + (p[j][1] - 10) + 'px; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid ' + (s.drag === j ? '#ffcc00' : '#141519') + '; cursor: grab; box-shadow: 0 2px 6px #0008',
        down: (e) => { e.preventDefault(); e.stopPropagation(); this.setState({ drag: j, hist: snapshot() }); } })),
      move: (e) => { if (!s.drag) return; const [x, y] = stage(e); const np = Object.assign({}, k.p, { [s.drag]: [x, y] }); this.setState({ keys: s.keys.map((q, i) => (i === s.cur ? { t: q.t, p: np } : q)) }); },
      up: () => { if (s.drag || s.kdrag !== null) this.setState({ drag: null, kdrag: null }); },
      allow: (e) => e.preventDefault(),
      dropPreset: (e) => { e.preventDefault(); const n = e.dataTransfer.getData('text/plain'); if (this.P[n]) this.setState({ hist: snapshot(), keys: s.keys.map((q, i) => (i === s.cur ? { t: q.t, p: this.pose(this.P[n]) } : q)) }); },
      ticks: Array.from({ length: 13 }, (_, i) => 'position: absolute; left: calc(' + (i / 12 * 100) + '% - ' + (i === 12 ? 1 : 0) + 'px); top: 0; bottom: 0; width: 1px; background: #2a2d35'),
      playhead: 'position: absolute; top: 0; bottom: 0; width: 2px; background: #ffcc00; left: ' + ((s.playing ? s.time : k.t) / 48 * 100) + '%',
      keys: s.keys.map((q, i) => ({ label: 'Key at ' + (q.t / 24).toFixed(1) + ' seconds',
        style: 'position: absolute; top: 13px; left: calc(' + (q.t / 48 * 100) + '% - 14px); width: 28px; height: 28px; border: none; cursor: pointer; transform: rotate(45deg); border-radius: 6px; background: ' + (i === s.cur ? '#ffcc00' : '#6f7480'),
        down: (e) => { if (e.button !== 0) return; e.stopPropagation(); this.setState({ cur: i, kdrag: i, playing: false }); },
        menu: (e) => { e.preventDefault(); e.stopPropagation(); const r = e.currentTarget.closest('[data-stage]').getBoundingClientRect(); this.setState({ cur: i, menu: { x: Math.min(e.clientX - r.left, r.width - 240), y: e.clientY - r.top - 200 } }); } })),
      moveKey: (e) => { if (s.kdrag === null) return; const r = e.currentTarget.getBoundingClientRect(); const t = Math.max(0, Math.min(47, Math.round((e.clientX - r.left) / r.width * 48))); this.setState({ keys: s.keys.map((q, i) => (i === s.kdrag ? { t, p: q.p } : q)) }); },
      addKey: () => { const t = Math.min(47, sorted[sorted.length - 1].t + 6); this.setState({ hist: snapshot(), keys: s.keys.concat([{ t, p: this.pose(k.p) }]), cur: s.keys.length }); },
      play: () => {
        if (s.playing) { clearInterval(this.timer); this.setState({ playing: false }); return; }
        this.setState({ playing: true, time: 0 });
        clearInterval(this.timer);
        this.timer = setInterval(() => { this.setState({ time: (this.state.time + this.state.speed / 100) % 48 }); }, 40);
      },
      playIcon: s.playing ? '❚❚' : '▶',
      timeText: ((s.playing ? s.time : k.t) / 24).toFixed(1) + ' s of 2.0 s',
      closeMenu: () => { if (s.menu) this.setState({ menu: null }); },
      menu: m ? { show: true, style: 'left: ' + m.x + 'px; top: ' + m.y + 'px', items: [
        { label: 'Duplicate', key: '', run: () => this.setState({ menu: null, hist: snapshot(), keys: s.keys.concat([{ t: Math.min(47, k.t + 4), p: this.pose(k.p) }]) }) },
        { label: 'Mirror pose', key: 'M', run: () => { const q = k.p; const mir = (a) => [800 - a[0], a[1]]; const np = { hip: mir(q.hip), chest: mir(q.chest), lEl: mir(q.rEl), lHa: mir(q.rHa), rEl: mir(q.lEl), rHa: mir(q.lHa), lKn: mir(q.rKn), lFo: mir(q.rFo), rKn: mir(q.lKn), rFo: mir(q.lFo) }; this.setState({ menu: null, hist: snapshot(), keys: s.keys.map((x, i) => (i === s.cur ? { t: x.t, p: np } : x)) }); } },
        { label: 'Reset to standing', key: '', run: () => this.setState({ menu: null, hist: snapshot(), keys: s.keys.map((x, i) => (i === s.cur ? { t: x.t, p: this.pose(this.P.Stand) } : x)) }) },
        { label: 'Delete', key: 'Del', run: () => { if (s.keys.length > 1) this.setState({ menu: null, hist: snapshot(), keys: s.keys.filter((x, i) => i !== s.cur), cur: 0 }); } }
      ] } : { show: false, items: [] },
      moves: ['Walk', 'Idle', 'Hammer swing', 'Celebrate', 'New move…'].map((n) => ({ name: n, pick: () => this.setState({ move: n }), style: 'text-align: left; min-height: 40px; padding: 0 12px; border-radius: 10px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; color: #f2f2f4; background: ' + (n === s.move ? '#3a3420' : '#24262d') + '; box-shadow: ' + (n === s.move ? 'inset 0 0 0 2px #ffcc00' : 'none') })),
      presets: Object.keys(this.P).map((n) => ({ name: n, start: (e) => e.dataTransfer.setData('text/plain', n) })),
      speed: s.speed, setSpeed: (e) => this.setState({ speed: +e.target.value }),
      undo: () => { if (!s.hist.length) return; this.setState({ keys: s.hist[s.hist.length - 1], hist: s.hist.slice(0, -1) }); }
    };
  }
}
</script>
</body>
</html>
