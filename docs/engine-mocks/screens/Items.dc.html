<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Items & combat</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#141519}
a{color:#ffcc00}a:hover{color:#ffd633}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:none;background:#24262d;color:#f2f2f4;font:600 14px 'Figtree',sans-serif;text-decoration:none;cursor:pointer}
.btn:hover{background:#2c2f37;color:#fff}
.pri{background:#ffcc00;color:#141519}
.pri:hover{background:#ffd633;color:#141519}
.ico{width:40px;padding:0}
.card{background:#1d1f25;border-radius:20px;padding:18px}
.ltab{padding:8px 14px;border-radius:10px;border:none;background:none;color:#9ea3ad;font:600 14px 'Figtree',sans-serif;cursor:pointer}
.ltab:hover{color:#f2f2f4}
.lon{background:#24262d;color:#f2f2f4}
.tilelib{display:flex;flex-direction:column;align-items:center;gap:8px;width:96px;padding:10px 6px;border-radius:14px;background:#24262d;color:#f2f2f4;font:600 12px 'Figtree',sans-serif;cursor:grab;user-select:none;text-align:center}
.tilelib:hover{background:#2c2f37}
.menu{position:absolute;z-index:30;min-width:220px;padding:6px;border-radius:14px;background:#24262d;box-shadow:0 16px 40px #000a;display:flex;flex-direction:column}
.mi{display:flex;justify-content:space-between;gap:16px;padding:9px 12px;border:none;border-radius:9px;background:none;color:#f2f2f4;font:500 14px 'Figtree',sans-serif;text-align:left;cursor:pointer}
.mi:hover{background:#ffcc0026}
.sep{height:1px;background:#33363e;margin:4px 8px}
.fld{display:flex;flex-direction:column;gap:6px;font-size:13px;color:#9ea3ad}
.inp{min-height:40px;padding:0 12px;border-radius:10px;border:none;background:#141519;color:#f2f2f4;font:15px 'Figtree',sans-serif}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#2c2f37;font-size:13px;color:#f2f2f4;border:none;font-family:'Figtree',sans-serif;cursor:grab}
.lbl{font-size:13px;font-weight:700;color:#9ea3ad;letter-spacing:.06em;text-transform:uppercase}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#1d1f25}
.toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;padding:10px 10px 10px 16px;border-radius:14px;background:#24262d;box-shadow:0 10px 30px #0008;font-size:14px;z-index:40}
</style>
</helmet>
<div style="display: flex; min-height: 900px; background: #141519; color: #f2f2f4; font-family: 'Figtree', system-ui, sans-serif">
  <dc-import name="Nav" active="gear" hint-size="96px,900px"></dc-import>
  <main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 20px">
      <div style="display: flex; flex-direction: column"><span style="font-size: 18px; font-weight: 700">Items and combat</span><span style="font-size: 13px; color: #9ea3ad">Weapons, tools and how fights feel</span></div>
      
      <span style="flex: 1 1 auto"></span>
      <button type="button" class="btn ico" aria-label="Undo" onClick="{{undo}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3"></path></svg></button>
      <a class="btn" href="Brix.dc.html">Ask Brix</a>
      <a class="btn pri" href="Play.dc.html">Play</a>
    </header>
    <dc-import name="Sub" group="gear" active="Items & combat" hint-size="900px,46px"></dc-import>
    <div data-stage="1" style="position: relative; display: flex; flex-wrap: wrap; gap: 14px; padding: 0 20px 20px; flex: 1 1 auto">
      <aside class="card" style="flex: 0 0 250px; display: flex; flex-direction: column; gap: 8px">
        <div class="seg" style="flex-wrap: wrap"><sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><button type="button" class="{{c.cls}}" onClick="{{c.pick}}">{{c.name}}</button></sc-for></div>
        <sc-for list="{{items}}" as="i" hint-placeholder-count="7"><button type="button" style="{{i.style}}" onClick="{{i.pick}}"><span style="{{i.sw}}"></span>{{i.name}}</button></sc-for>
        <button type="button" class="btn" onClick="{{newItem}}">New item</button>
      </aside>
      <section style="flex: 999 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 14px">
        <div class="card" style="display: flex; gap: 18px; align-items: center">
          <span style="{{icon}}"></span>
          <div style="flex: 1 1 auto"><div style="font-size: 24px; font-weight: 800">{{name}}</div><div style="font-size: 14px; color: #9ea3ad">{{desc}}</div></div>
          <div class="fld" style="min-width: 150px">Button<select class="inp"><option>Item button (adapts)</option><option>Attack</option><option>Use</option></select></div>
        </div>
        <div class="card" style="display: flex; flex-direction: column; gap: 10px">
          <span class="lbl">Moves · each hits differently</span>
          <sc-for list="{{moves}}" as="m" hint-placeholder-count="3">
            <div style="display: flex; align-items: center; gap: 12px; padding: 8px 0; border-top: 1px solid #2a2d35">
              <span style="flex: 0 0 130px; font-weight: 600">{{m.name}}</span>
              <span style="flex: 0 0 110px; font-size: 13px; color: #9ea3ad">{{m.how}}</span>
              <input type="range" min="1" max="8" value="{{m.power}}" onInput="{{m.set}}" style="flex: 1 1 auto; accent-color: #ffcc00" aria-label="Hit power">
              <span style="flex: 0 0 90px; color: #ff6b6b; font-weight: 700">{{m.hearts}}</span>
              <button type="button" class="btn" style="min-height: 32px; font-size: 13px" onClick="{{m.test}}">Try</button>
            </div>
          </sc-for>
        </div>
        <div style="position: relative; height: 220px; border-radius: 20px; overflow: hidden; background-color: #2d4a33; background-image: radial-gradient(#3b5c42 2px, transparent 2px); background-size: 20px 20px">
          <span style="position: absolute; left: 120px; top: 100px; width: 44px; height: 44px; border-radius: 22px 22px 10px 10px; background: #e8463c"></span>
          <span style="{{proj}}"></span>
          <span style="{{dummy}}"></span>
          <div style="position: absolute; left: 520px; top: 48px; width: 120px; height: 10px; border-radius: 5px; background: #141519"><span style="{{hpBar}}"></span></div>
          <sc-if value="{{hit.show}}" hint-placeholder-val="{{ false }}"><span style="{{hit.style}}">−{{hit.n}}</span></sc-if>
          <span style="position: absolute; left: 14px; top: 12px; font-size: 13px; color: #e4e6ea">Practice dummy · {{hp}} of 12 hearts left</span>
          <button type="button" class="btn" style="position: absolute; right: 12px; bottom: 12px; min-height: 32px; font-size: 13px" onClick="{{heal}}">Reset dummy</button>
        </div>
      </section>
      <aside style="flex: 1 1 280px; max-width: 320px; display: flex; flex-direction: column; gap: 14px">
        <div class="card" style="display: flex; flex-direction: column; gap: 12px">
          <span class="lbl">What it can do</span>
          <sc-for list="{{abil}}" as="f" hint-placeholder-count="5"><button type="button" onClick="{{f.flip}}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0; border: none; background: none; color: #f2f2f4; font: 500 14px Figtree, sans-serif; cursor: pointer; text-align: left"><span>{{f.name}}</span><span style="{{f.track}}"><span style="{{f.knob}}"></span></span></button></sc-for>
          <sc-if value="{{hasAmmo}}" hint-placeholder-val="{{ false }}"><label class="fld">Ammo · {{ammo}}<input type="range" min="0" max="99" value="{{ammo}}" onInput="{{setAmmo}}" style="accent-color: #ffcc00"></label></sc-if>
        </div>
        <div class="card" style="display: flex; flex-direction: column; gap: 12px">
          <span class="lbl">Fights in this game</span>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px"><sc-for list="{{styles}}" as="g" hint-placeholder-count="4"><button type="button" style="{{g.style}}" onClick="{{g.pick}}">{{g.name}}</button></sc-for></div>
          <sc-for list="{{fight}}" as="f" hint-placeholder-count="4"><button type="button" onClick="{{f.flip}}" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 0; border: none; background: none; color: #f2f2f4; font: 500 14px Figtree, sans-serif; cursor: pointer; text-align: left"><span style="display: flex; flex-direction: column"><span>{{f.name}}</span><span style="font-size: 12px; color: #9ea3ad">{{f.desc}}</span></span><span style="{{f.track}}"><span style="{{f.knob}}"></span></span></button></sc-for>
        </div>
      </aside>
      <sc-if value="{{toast.show}}" hint-placeholder-val="{{ false }}"><div class="toast">{{toast.text}}<button type="button" class="btn" style="min-height: 34px" onClick="{{undo}}">Undo</button></div></sc-if>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const H = {
  at: (e) => { const r = e.currentTarget.closest('[data-stage]').getBoundingClientRect(); return [Math.min(e.clientX - r.left, r.width - 250), Math.min(e.clientY - r.top, r.height - 260)]; },
  menu: (m, title, items) => (m ? { show: true, title, style: 'left: ' + m.x + 'px; top: ' + m.y + 'px', items } : { show: false, title: '', items: [] }),
  toast: (t) => (t ? { show: true, text: t } : { show: false, text: '' }),
  pick: (on) => 'min-height: 38px; padding: 0 14px; border-radius: 10px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: ' + (on ? '#141519' : '#f2f2f4') + '; background: ' + (on ? '#ffcc00' : '#24262d'),
  card: (on) => 'display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 12px; border-radius: 14px; border: none; cursor: pointer; font: 600 14px Figtree, sans-serif; text-align: left; color: #f2f2f4; background: ' + (on ? '#3a3420' : '#24262d') + '; box-shadow: ' + (on ? 'inset 0 0 0 2px #ffcc00' : 'none'),
  track: (on) => 'flex: 0 0 auto; width: 46px; height: 28px; border-radius: 14px; position: relative; background: ' + (on ? '#ffcc00' : '#33363e'),
  knob: (on) => 'position: absolute; top: 3px; left: ' + (on ? 21 : 3) + 'px; width: 22px; height: 22px; border-radius: 50%; background: #fff',
  tab: (on) => (on ? 'ltab lon' : 'ltab'),
  sw: (c, on, size) => 'width: ' + (size || 30) + 'px; height: ' + (size || 30) + 'px; border-radius: 8px; border: none; cursor: pointer; background: ' + c + '; box-shadow: ' + (on ? '0 0 0 3px #141519, 0 0 0 5px #fff' : 'none')
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    const I = (cat, name, c, desc, moves, ab, ammo) => ({ cat, name, c, desc, moves, ab, ammo });
    this.state = { cat: 'Weapons', cur: 'Sword', hp: 12, hit: null, shot: null, toast: null, hist: [], style: 'Action',
      fight: { lock: true, strafe: true, block: true, parry: false },
      items: [
        I('Weapons', 'Sword', '#d8d8d8', 'Close-up hits. Can cut grass and hit switches.', [['Swing', 'Tap', 1], ['Spin attack', 'Hold, let go', 3], ['Jump strike', 'While locked on', 2]], { switches: true, stun: false, pull: false, back: false, breaks: true }, 0),
        I('Weapons', 'Bow', '#8a5a2b', 'Shoots arrows at far things. Arrows hit switches and targets.', [['Arrow', 'Tap', 1], ['Charged arrow', 'Hold', 3], ['Fire arrow', 'Near a torch', 4]], { switches: true, stun: false, pull: false, back: false, breaks: false }, 30),
        I('Weapons', 'Boomerang', '#ffcc00', 'Flies out and comes back. Stuns enemies, grabs items.', [['Throw', 'Tap', 0.5]], { switches: true, stun: true, pull: false, back: true, breaks: false }, 0),
        I('Weapons', 'Hookshot', '#8b93a3', 'Pulls you to wooden posts, pulls items to you.', [['Shoot', 'Tap', 1]], { switches: true, stun: true, pull: true, back: true, breaks: false }, 0),
        I('Weapons', 'Bombs', '#2f3440', 'Blow up cracked walls and groups of enemies.', [['Throw', 'Tap', 4], ['Drop', 'Hold', 4]], { switches: true, stun: false, pull: false, back: false, breaks: true }, 10),
        I('Weapons', 'Grenade', '#45c46e', 'Arcs through the air, bursts after 2 seconds.', [['Throw', 'Tap', 5]], { switches: false, stun: false, pull: false, back: false, breaks: true }, 5),
        I('Weapons', 'Bazooka', '#3f8f4a', 'Big rocket for tanks and boss weak spots.', [['Fire', 'Tap', 8]], { switches: true, stun: false, pull: false, back: false, breaks: true }, 4),
        I('Weapons', 'Blaster', '#3b78c9', 'For shooting games. Works in first person too.', [['Shot', 'Tap', 1], ['Rapid fire', 'Hold', 0.5]], { switches: true, stun: false, pull: false, back: false, breaks: false }, 60),
        I('Shields', 'Wooden shield', '#c9893f', 'Blocks hits from the front. Burns in fire.', [['Block', 'Hold', 0], ['Shield bash', 'Tap while blocking', 1]], { switches: false, stun: true, pull: false, back: false, breaks: false }, 0),
        I('Shields', 'Mirror shield', '#7cc7ff', 'Blocks and bounces light and magic back.', [['Block', 'Hold', 0], ['Reflect', 'Block at the right time', 2]], { switches: true, stun: true, pull: false, back: false, breaks: false }, 0),
        I('Tools', 'Lantern', '#ffd633', 'Lights dark rooms and torches.', [['Light', 'Tap near a torch', 0]], { switches: true, stun: false, pull: false, back: false, breaks: false }, 0),
        I('Tools', 'Small key', '#ffcc00', 'Opens one locked door in this dungeon.', [['Use', 'Walk into a door', 0]], { switches: false, stun: false, pull: false, back: false, breaks: false }, 0),
        I('Pickups', 'Heart', '#ff6b6b', 'Gives back one heart.', [['Pick up', 'Walk over', 0]], { switches: false, stun: false, pull: false, back: false, breaks: false }, 0),
        I('Pickups', 'Coin', '#ffcc00', 'Money. Blue is 5, red is 20.', [['Pick up', 'Walk over', 0]], { switches: false, stun: false, pull: false, back: false, breaks: false }, 0)
      ] };
  }
  renderVals() {
    const s = this.state;
    const it = s.items.find((x) => x.name === s.cur) || s.items[0];
    const upd = (o) => this.setState({ hist: s.hist.concat([s.items]).slice(-20), items: s.items.map((x) => (x.name === it.name ? Object.assign({}, x, o) : x)) });
    const hearts = (p) => (p <= 0 ? 'No damage' : p < 1 ? '½ ♥' : '♥'.repeat(Math.min(8, Math.round(p))));
    const ranged = ['Bow', 'Boomerang', 'Hookshot', 'Bombs', 'Grenade', 'Bazooka', 'Blaster'].indexOf(it.name) >= 0;
    const attack = (p) => { const left = Math.max(0, s.hp - p); clearTimeout(this.t1); clearInterval(this.t2);
      if (ranged) { let x = 170; this.t2 = setInterval(() => { x += 40; if (x >= 520) { clearInterval(this.t2); this.setState({ shot: null, hp: left, hit: { n: p } }); this.t1 = setTimeout(() => this.setState({ hit: null }), 700); } else this.setState({ shot: x }); }, 30); }
      else { this.setState({ hp: left, hit: { n: p } }); this.t1 = setTimeout(() => this.setState({ hit: null }), 700); }
      if (left === 0) this.setState({ toast: 'Dummy broke into bricks!' }); };
    return {
      cats: ['Weapons', 'Shields', 'Tools', 'Pickups'].map((c) => ({ name: c, cls: H.tab(c === s.cat), pick: () => this.setState({ cat: c, cur: s.items.find((x) => x.cat === c).name }) })),
      items: s.items.filter((x) => x.cat === s.cat).map((x) => ({ name: x.name, style: H.pick(x.name === it.name) + '; display: flex; align-items: center; gap: 10px', sw: 'width: 22px; height: 22px; border-radius: 6px; background: ' + x.c, pick: () => this.setState({ cur: x.name }) })),
      newItem: () => { const n = 'New ' + s.cat.toLowerCase().replace(/s$/, ''); this.setState({ items: s.items.concat([{ cat: s.cat, name: n, c: '#a78bfa', desc: 'Describe what it does.', moves: [['Use', 'Tap', 1]], ab: { switches: false, stun: false, pull: false, back: false, breaks: false }, ammo: 0 }]), cur: n }); },
      icon: 'flex: 0 0 auto; width: 72px; height: 72px; border-radius: 18px; background: ' + it.c + '; box-shadow: inset 0 -8px 0 #0003',
      name: it.name, desc: it.desc,
      moves: it.moves.map((mv, i) => ({ name: mv[0], how: mv[1], power: Math.max(1, Math.round(mv[2])), hearts: hearts(mv[2]),
        set: (e) => upd({ moves: it.moves.map((x, j) => (j === i ? [x[0], x[1], +e.target.value] : x)) }), test: () => attack(mv[2]) })),
      proj: s.shot ? 'position: absolute; left: ' + s.shot + 'px; top: 116px; width: 18px; height: 10px; border-radius: 5px; background: ' + it.c : 'display: none',
      dummy: 'position: absolute; left: 540px; top: 80px; width: 80px; height: 90px; border-radius: 14px; background: #c9a36a; transition: transform .1s; transform: ' + (s.hit ? 'translateX(10px) rotate(6deg)' : 'none') + '; opacity: ' + (s.hp === 0 ? 0.25 : 1),
      hpBar: 'display: block; height: 100%; border-radius: 5px; background: #ff6b6b; width: ' + (s.hp / 12 * 100) + '%',
      hit: s.hit ? { show: true, n: s.hit.n, style: 'position: absolute; left: 600px; top: 60px; font-size: 26px; font-weight: 800; color: #ffcc00; text-shadow: 0 2px 4px #000' } : { show: false, n: 0, style: '' },
      hp: Math.round(s.hp * 2) / 2, heal: () => this.setState({ hp: 12, hit: null }),
      abil: [['switches', 'Hits switches and targets'], ['stun', 'Stuns enemies'], ['pull', 'Pulls you or things'], ['back', 'Comes back to you'], ['breaks', 'Breaks bricks, pots and walls']].map(([k, n]) => ({ name: n, flip: () => upd({ ab: Object.assign({}, it.ab, { [k]: !it.ab[k] }) }), track: H.track(it.ab[k]), knob: H.knob(it.ab[k]) })),
      hasAmmo: it.ammo > 0 || ranged, ammo: it.ammo, setAmmo: (e) => upd({ ammo: +e.target.value }),
      styles: ['Action', 'Turn-based', 'Active time', 'First-person'].map((g) => ({ name: g, style: H.pick(g === s.style) + '; font-size: 13px; padding: 0 8px; text-align: center', pick: () => this.setState({ style: g }) })),
      fight: [['lock', 'Lock on to targets', 'Like Zelda: hold to face one enemy'], ['strafe', 'Circle while locked', 'Move around the target'], ['block', 'Block with shields', 'Hold to block from the front'], ['parry', 'Perfect block', 'Block right before a hit to stun']].map(([k, n, d]) => ({ name: n, desc: d, flip: () => this.setState({ fight: Object.assign({}, s.fight, { [k]: !s.fight[k] }) }), track: H.track(s.fight[k]), knob: H.knob(s.fight[k]) })),
      toast: H.toast(s.toast),
      undo: () => { if (!s.hist.length) { this.setState({ toast: null, hp: 12 }); return; } this.setState({ items: s.hist[s.hist.length - 1], hist: s.hist.slice(0, -1), toast: null }); }
    };
  }
}
</script>
</body>
</html>
